name: Fed Cycle Event Study

on:
  push:
    paths:
      - "research/test_tqqq_fed_cycle.py"
      - ".github/workflows/tqqq-fed-cycle.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-fed-cycle
  cancel-in-progress: false

jobs:
  fed-cycle-study:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_fed_cycle.py
      - name: Run Fed cycle event study
        run: python research/test_tqqq_fed_cycle.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-fed-cycle-event-study
          path: |
            data/research/fed_action_timeline.csv
            data/research/fed_action_dates.csv
            data/research/fed_tightening_cycles.csv
            data/research/fed_cycle_market_event_study.csv
