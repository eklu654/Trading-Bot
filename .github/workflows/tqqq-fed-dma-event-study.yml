name: Fed State x DMA Event Study

on:
  push:
    paths:
      - "research/test_tqqq_fed_dma_event_study.py"
      - ".github/workflows/tqqq-fed-dma-event-study.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-fed-dma-event-study
  cancel-in-progress: false

jobs:
  fed-dma-event-study:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_fed_dma_event_study.py
      - name: Run event study
        run: python research/test_tqqq_fed_dma_event_study.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-fed-dma-event-study
          path: |
            data/research/tqqq_fed_dma_daily_states.csv
            data/research/tqqq_fed_dma_event_observations.csv
            data/research/tqqq_fed_dma_event_summary.csv
