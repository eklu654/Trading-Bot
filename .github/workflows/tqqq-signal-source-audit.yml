name: TQQQ signal-source audit

on:
  push:
    paths:
      - "research/tqqq_signal_source_audit.py"
      - ".github/workflows/tqqq-signal-source-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_signal_source_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-signal-source-audit
          path: data/research/tqqq_signal_source_audit.csv
