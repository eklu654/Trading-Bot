name: TQQQ SQQQ crash walkforward
on:
  push:
    paths:
      - "research/tqqq_sqqq_crash_walkforward.py"
      - ".github/workflows/tqqq-sqqq-crash-walkforward.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_sqqq_crash_walkforward.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-sqqq-crash-walkforward
          path: data/research/tqqq_sqqq_crash_walkforward.csv
