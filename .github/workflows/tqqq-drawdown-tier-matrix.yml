name: TQQQ QQQ drawdown tier matrix

on:
  push:
    paths:
      - "research/tqqq_drawdown_tier_matrix.py"
      - "research/causal_execution.py"
      - ".github/workflows/tqqq-drawdown-tier-matrix.yml"
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python -m pip install -r research/requirements.txt
      - run: PYTHONPATH=. python research/tqqq_drawdown_tier_matrix.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-drawdown-tier-matrix
          path: data/research/tqqq_drawdown_tier_matrix.csv
