name: ETF-027 Signal Transition Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/backtest_etf027_signal_transition_diagnostics.py"
      - "research/backtest_etf026_bear_event_archetypes.py"
      - ".github/workflows/etf027-signal-transition-diagnostics.yml"
      - "research/build_historical_regime_dataset.py"
      - "research/requirements.txt"

concurrency:
  group: etf027-signal-transition-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: research/requirements.txt
      - name: Cache historical research dataset
        uses: actions/cache@v4
        with:
          path: data/research
          key: etf-research-dataset-${{ hashFiles('research/build_historical_regime_dataset.py') }}-2026-09-28
      - run: python -m pip install -r research/requirements.txt
      - name: Build historical dataset when cache is cold
        run: python research/build_historical_regime_dataset.py
      - name: Run ETF-027 transition diagnostics
        run: python research/backtest_etf027_signal_transition_diagnostics.py
      - name: Upload ETF-027 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: etf027-signal-transition-diagnostics
          path: |
            data/research/etf027_event_transition_summary.csv
            data/research/etf027_events_of_interest.csv
