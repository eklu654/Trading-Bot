name: Crash hybrid SQQQ recovery
on:
  push:
    paths:
      - "research/crash_hybrid_sqqq_recovery.py"
      - ".github/workflows/crash-hybrid-sqqq-recovery.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/crash_hybrid_sqqq_recovery.py
      - run: cat data/research/crash_hybrid_sqqq_recovery.csv
      - uses: actions/upload-artifact@v4
        with:
          name: crash-hybrid-sqqq-recovery
          path: data/research/crash_hybrid_sqqq_recovery.csv
