name: TQQQ 100-DMA Exit Signatures

on:
  push:
    paths:
      - "research/analyze_tqqq_100dma_exit_signatures.py"
      - ".github/workflows/tqqq-100dma-exit-signatures.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-100dma-exit-signatures
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/analyze_tqqq_100dma_exit_signatures.py
      - run: python research/analyze_tqqq_100dma_exit_signatures.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-100dma-exit-signatures
          path: data/research/tqqq_100dma_exit_signatures.csv
