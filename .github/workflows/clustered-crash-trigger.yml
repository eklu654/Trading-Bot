name: Clustered crash trigger
on:
  push:
    paths:
      - "research/clustered_crash_trigger.py"
      - ".github/workflows/clustered-crash-trigger.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/clustered_crash_trigger.py
      - uses: actions/upload-artifact@v4
        with:
          name: clustered-crash-trigger
          path: data/research/clustered_crash_trigger.csv
