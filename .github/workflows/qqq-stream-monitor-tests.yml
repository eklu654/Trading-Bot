name: QQQ Persistent Stream Monitor - Tests

on:
  push:
    branches: [main]
    paths:
      - "research/qqq_stream_monitor.py"
      - "research/test_qqq_stream_monitor.py"
      - "requirements-stream-monitor.txt"
      - ".github/workflows/qqq-stream-monitor-tests.yml"
  pull_request:
    paths:
      - "research/qqq_stream_monitor.py"
      - "research/test_qqq_stream_monitor.py"
      - "requirements-stream-monitor.txt"
      - ".github/workflows/qqq-stream-monitor-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stream client dependency
        run: python -m pip install -r requirements-stream-monitor.txt
      - name: Compile monitor
        run: python -m py_compile research/qqq_stream_monitor.py
      - name: Run deterministic stream monitor tests
        env:
          PYTHONPATH: research
        run: python research/test_qqq_stream_monitor.py
