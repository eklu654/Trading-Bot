name: TQQQ failed-bounce feature audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/failed_bounce_feature_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-failed-bounce-feature-audit
          path: |
            data/research/failed_bounce_feature_audit_events.csv
            data/research/failed_bounce_feature_audit_separation.csv
