name: TQQQ three-layer event attribution
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: python research/tqqq_three_layer_event_attribution.py
