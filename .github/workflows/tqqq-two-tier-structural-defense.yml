name: TQQQ Two-Tier Structural Defense

on:
  push:
    paths:
      - "research/tqqq_two_tier_structural_defense_matrix.py"
      - "research/test_tqqq_macro_regime.py"
      - "research/test_tqqq_fed_paused_dma_sticky.py"
      - "research/causal_execution.py"
      - ".github/workflows/tqqq-two-tier-structural-defense.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-two-tier-structural-defense
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python -m pip install -r research/requirements.txt
      - run: PYTHONPATH=. python research/tqqq_two_tier_structural_defense_matrix.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-two-tier-structural-defense
          path: data/research/tqqq_two_tier_structural_defense_matrix.csv
