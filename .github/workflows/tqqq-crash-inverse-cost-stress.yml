name: TQQQ crash inverse cost stress
on:
  push:
    paths:
      - "research/tqqq_crash_inverse_cost_stress.py"
      - ".github/workflows/tqqq-crash-inverse-cost-stress.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_crash_inverse_cost_stress.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-crash-inverse-cost-stress
          path: data/research/tqqq_crash_inverse_cost_stress.csv
