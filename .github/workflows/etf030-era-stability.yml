name: ETF-030 Temporal Stability Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/backtest_etf030_era_stability.py"
      - "research/backtest_etf026_bear_event_archetypes.py"
      - "research/build_historical_regime_dataset.py"
      - "research/requirements.txt"
      - ".github/workflows/etf030-era-stability.yml"

concurrency:
  group: etf030-era-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: research/requirements.txt
      - name: Cache historical research dataset
        id: dataset-cache
        uses: actions/cache@v4
        with:
          path: data/research
          key: etf-research-dataset-${{ hashFiles('research/build_historical_regime_dataset.py') }}-2026-09-28
      - run: python -m pip install -r research/requirements.txt
      - name: Build historical dataset when cache is cold
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: python research/build_historical_regime_dataset.py
      - name: Run ETF-030 temporal stability diagnostics
        run: python research/backtest_etf030_era_stability.py
      - name: Upload ETF-030 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: etf030-era-stability-diagnostics
          path: |
            data/research/etf030_era_stability_summary.csv
            data/research/etf030_event_rows.csv
