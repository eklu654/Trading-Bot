name: Crash partial reentry causal
on:
  push:
    paths:
      - "research/crash_partial_reentry_causal.py"
      - ".github/workflows/crash-partial-reentry-causal.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/crash_partial_reentry_causal.py
      - uses: actions/upload-artifact@v4
        with:
          name: crash-partial-reentry-causal
          path: data/research/crash_partial_reentry_causal.csv
