name: TQQQ 100-DMA re-entry regime validation
on:
  push:
    paths:
      - "research/tqqq_100dma_reentry_regime_validation.py"
      - "research/causal_execution.py"
      - ".github/workflows/tqqq-100dma-reentry-regime-validation.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_100dma_reentry_regime_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-100dma-reentry-regime-validation
          path: data/research/tqqq_100dma_reentry_regime_validation.csv
