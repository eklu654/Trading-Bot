name: Dynamic ETF Research

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_dynamic_leverage.py"
      - "research/compare_leverage_benchmarks.py"
      - "research/build_historical_regime_dataset.py"
      - "tests/test_backtest_dynamic_leverage.py"
      - "research/backtest_dynamic_etf_selection.py"
      - "research/analyze_dynamic_performance.py"
      - "research/analyze_stress_periods.py"
      - "research/analyze_switch001_regimes.py"
      - "research/analyze_regime_directional_opportunity.py"
      - "research/test_dma_fallback_controls.py"
      - "research/test_dma_reentry_confirmation.py"
      - "research/test_tqqq_dma_sensitivity.py"
      - "tests/test_dma_fallback_controls.py"
      - "tests/test_dma_reentry_confirmation.py"
      - "tests/test_dma_bull_bear_switching.py"
      - "tests/test_dynamic_etf_selection.py"
      - "tests/test_analyze_switch001_regimes.py"
      - "tests/test_analyze_regime_directional_opportunity.py"
      - "research/backtest_dynamic_sizing.py"
      - "tests/test_dynamic_sizing.py"
      - ".github/workflows/dynamic-etf-research.yml"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynamic-etf-research:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            research/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile research/backtest_dynamic_leverage.py research/compare_leverage_benchmarks.py research/build_historical_regime_dataset.py research/backtest_dynamic_etf_selection.py research/analyze_dynamic_performance.py research/analyze_stress_periods.py research/analyze_switch001_regimes.py research/analyze_regime_directional_opportunity.py research/backtest_dynamic_sizing.py research/test_dma_fallback_controls.py research/test_dma_reentry_confirmation.py research/test_dma_bull_bear_switching.py research/test_tqqq_dma_sensitivity.py
      - name: Run dynamic benchmark unit tests
        run: python -m pytest -q tests/test_backtest_dynamic_leverage.py tests/test_dynamic_etf_selection.py tests/test_dynamic_sizing.py tests/test_dma_fallback_controls.py tests/test_dma_reentry_confirmation.py tests/test_dma_bull_bear_switching.py tests/test_analyze_switch001_regimes.py tests/test_analyze_regime_directional_opportunity.py tests/test_tqqq_dma_sensitivity.py
      - name: Build historical market dataset once
        run: python research/build_historical_regime_dataset.py
      - name: Run parallel research analyses
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          python research/analyze_switch001_regimes.py &
          pids+=($!)
          python research/analyze_regime_directional_opportunity.py &
          pids+=($!)
          python research/backtest_dynamic_leverage.py &
          pids+=($!)
          python research/compare_leverage_benchmarks.py &
          pids+=($!)
          python research/backtest_dynamic_etf_selection.py &
          pids+=($!)
          python research/backtest_dynamic_sizing.py &
          pids+=($!)
          python research/test_dma_fallback_controls.py &
          pids+=($!)
          python research/test_dma_reentry_confirmation.py &
          pids+=($!)
          python research/test_dma_bull_bear_switching.py &
          pids+=($!)
          python research/test_tqqq_dma_sensitivity.py &
          pids+=($!)
          python research/analyze_stress_periods.py &
          pids+=($!)

          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          exit "$status"
      - name: Analyze annual and rolling SPY-relative performance
        run: python research/analyze_dynamic_performance.py
      - name: Print SWITCH-001 regime summary
        run: cat data/research/switch001_regime_summary.csv
      - name: Print regime directional opportunity
        run: cat data/research/regime_directional_opportunity.csv
      - name: Print benchmark
        run: cat data/research/dynamic_leverage_benchmark_summary.csv
      - name: Print leverage comparison
        run: cat data/research/leverage_strategy_comparison.csv
      - name: Print 2018-2025 leverage comparison
        run: cat data/research/leverage_strategy_comparison_2018_2025.csv
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-etf-research
          path: |
            data/research/dynamic_leverage_benchmark.csv
            data/research/dynamic_leverage_benchmark_summary.csv
            data/research/leverage_strategy_comparison.csv
            data/research/leverage_strategy_comparison_2018_2025.csv
            data/research/dynamic_relative_summary.csv
            data/research/dynamic_annual_returns.csv
            data/research/dynamic_rolling_relative.csv
            data/research/dynamic_etf_selection_comparison.csv
            data/research/dynamic_etf_selection_raw_60d.csv
            data/research/dynamic_etf_selection_trend_confirmed.csv
            data/research/dynamic_etf_selection_risk_adjusted_60d.csv
            data/research/stress_period_comparison.csv
            data/research/dynamic_sizing_e3.csv
            data/research/dynamic_sizing_e3_sqrt_ratio.csv
            data/research/dma_fallback_controls_2018_2025.csv
            data/research/dma_fallback_stress_2018_2025.csv
            data/research/dma_fallback_annual_returns_2018_2025.csv
            data/research/dma_reentry_confirmation_2018_2025.csv
            data/research/dma_bull_bear_switch_matrix.csv
            data/research/dma_bull_bear_switch_annual_returns.csv
            data/research/dma_bull_bear_switch_headline_holdout.csv
            data/research/dma_bull_bear_switch_combined_holdout.csv
            data/research/tqqq_dma_sensitivity_primary.csv
            data/research/tqqq_dma_sensitivity_2010_latest.csv
            data/research/tqqq_dma_reentry_final_balance_matrix.csv
            data/research/dynamic_sizing_e3_summary.csv
            data/research/dynamic_sizing_e3_annual_returns.csv
            data/research/dynamic_etf_selection_split_summary.csv
            data/research/dynamic_etf_selection_annual_returns.csv
            data/research/dynamic_etf_selection_rolling_relative.csv
            data/research/switch001_regime_performance.csv
            data/research/switch001_regime_summary.csv
            data/research/switch001_stress_regimes.csv
            data/research/regime_directional_opportunity.csv
          if-no-files-found: error
