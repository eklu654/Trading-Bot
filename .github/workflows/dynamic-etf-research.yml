name: Dynamic ETF Research

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_dynamic_leverage.py"
      - "research/build_historical_regime_dataset.py"
      - ".github/workflows/dynamic-etf-research.yml"

jobs:
  dynamic-etf-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile research/backtest_dynamic_leverage.py research/build_historical_regime_dataset.py
      - name: Run dynamic benchmark unit tests
        run: python -m pytest -q tests/test_backtest_dynamic_leverage.py
      - name: Build historical market dataset
        run: python research/build_historical_regime_dataset.py
      - name: Run deterministic dynamic leverage benchmark
        run: python research/backtest_dynamic_leverage.py
      - name: Print benchmark
        run: cat data/research/dynamic_leverage_benchmark_summary.csv
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-etf-research
          path: |
            data/research/dynamic_leverage_benchmark.csv
            data/research/dynamic_leverage_benchmark_summary.csv
          if-no-files-found: error
