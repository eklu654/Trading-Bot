name: Failed bounce MA matrix
on:
  push:
    paths: ["research/failed_bounce_ma_matrix.py",".github/workflows/failed-bounce-ma-matrix.yml"]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/failed_bounce_ma_matrix.py
      - uses: actions/upload-artifact@v4
        with:
          name: failed-bounce-ma-matrix
          path: |
            data/research/canonical_failed_bounce_ma_events.csv
            data/research/canonical_failed_bounce_ma_signal_stats.csv
            data/research/canonical_failed_bounce_ma_strategy_full.csv
            data/research/canonical_failed_bounce_ma_walkforward_selected.csv
