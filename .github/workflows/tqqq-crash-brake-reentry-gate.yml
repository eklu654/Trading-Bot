name: TQQQ crash brake reentry gate
on:
  push:
    paths:
      - "research/tqqq_crash_brake_reentry_gate.py"
      - ".github/workflows/tqqq-crash-brake-reentry-gate.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_crash_brake_reentry_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-crash-brake-reentry-gate
          path: data/research/tqqq_crash_brake_reentry_gate.csv
      - name: Publish result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+eklu654@users.noreply.github.com"
          git add data/research/tqqq_crash_brake_reentry_gate.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: publish crash brake reentry gate"
            git push
          fi
