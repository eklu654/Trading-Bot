name: Adaptive LEAPS Chronological Replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/adaptive-leaps-replay.yml"
      - "research/run_adaptive_leaps_replay.py"
      - "research/audit_adaptive_leaps_quote_continuity.py"
      - "research/audit_adaptive_leaps_source_discontinuity.py"
      - "research/adaptive_leaps_replay.py"
      - "research/adaptive_leaps_lifecycle.py"

permissions:
  contents: write

concurrency:
  group: adaptive-leaps-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish replay run receipt at start
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = "docs/LEAPS_REPLAY_LATEST_RUN.md";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "# Latest Adaptive LEAPS Replay Run",
              "",
              `- Run ID: ${context.runId}`,
              `- Run number: ${context.runNumber}`,
              `- Attempt: ${process.env.GITHUB_RUN_ATTEMPT || "1"}`,
              "- Workflow: Adaptive LEAPS Chronological Replay",
              `- Commit: ${context.sha}`,
              `- Ref: ${context.ref}`,
              "- Status: in_progress",
              `- Run URL: ${runUrl}`,
              "- Artifact name: adaptive-leaps-chronological-replay",
              "",
              "This receipt is published at workflow start so the active run is discoverable. The final step updates the status after replay and quality-gate completion; the run page and artifact remain authoritative.",
              ""
            ].join("\n");
            for (let attempt = 0; attempt < 3; attempt++) {
              let sha;
              try {
                const current = await github.rest.repos.getContent({ owner, repo, path, ref: "main" });
                if (Array.isArray(current.data)) throw new Error("Receipt path unexpectedly resolved to a directory");
                sha = current.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, message: `Publish Adaptive LEAPS replay start ${context.runId}`,
                  content: Buffer.from(body).toString("base64"), sha, branch: "main"
                });
                break;
              } catch (error) {
                if (error.status !== 409 || attempt === 2) throw error;
              }
            }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Install research dependencies
        run: python -m pip install -r research/requirements.txt

      - name: Download pinned SPY option chains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/options/spy
          for year in $(seq 2008 2025); do
            curl -fsSL --retry 3 --retry-delay 2 \
              -o "data/options/spy/options_${year}.parquet" \
              "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/spy/options_${year}.parquet"
          done

      - name: Download pinned QQQ option chains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/options/qqq
          for year in $(seq 2011 2025); do
            curl -fsSL --retry 3 --retry-delay 2 \
              -o "data/options/qqq/options_${year}.parquet" \
              "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/qqq/options_${year}.parquet"
          done

      - name: Download pinned underlying price series for continuity cross-check
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            -o data/options/spy/underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/spy/underlying_prices.parquet"
          curl -fsSL --retry 3 --retry-delay 2 \
            -o data/options/qqq/underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/qqq/underlying_prices.parquet"

      - name: Record source hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/adaptive_leaps_replay
          {
            echo "source_repository=https://github.com/anahatsingh-ui/options-dataset-hist"
            echo "source_commit=37f6c456fe1a4775c875673fb8ef907d5cd2fd66"
            sha256sum data/options/spy/*.parquet data/options/qqq/*.parquet
          } > artifacts/adaptive_leaps_replay/source_sha256.txt

      - name: Compile replay modules and runner
        run: |
          python -m py_compile research/adaptive_leaps_lifecycle.py
          python -m py_compile research/adaptive_leaps_replay.py
          python -m py_compile research/run_adaptive_leaps_replay.py
          python -m py_compile research/audit_adaptive_leaps_quote_continuity.py
          python -m py_compile research/audit_adaptive_leaps_source_discontinuity.py

      - name: Replay SPY — theoretical one-contract
        run: |
          python -m research.run_adaptive_leaps_replay \
            --symbol SPY --source "data/options/spy/options_*.parquet" \
            --out-dir artifacts/adaptive_leaps_replay/spy_theoretical

      - name: Replay SPY — $5,000 cash-constrained
        run: |
          python -m research.run_adaptive_leaps_replay \
            --symbol SPY --source "data/options/spy/options_*.parquet" \
            --out-dir artifacts/adaptive_leaps_replay/spy_cash_5000 --starting-cash 5000 \
            --enforce-account-cash

      - name: Replay QQQ — theoretical one-contract
        run: |
          python -m research.run_adaptive_leaps_replay \
            --symbol QQQ --source "data/options/qqq/options_*.parquet" \
            --out-dir artifacts/adaptive_leaps_replay/qqq_theoretical

      - name: Replay QQQ — $5,000 cash-constrained
        run: |
          python -m research.run_adaptive_leaps_replay \
            --symbol QQQ --source "data/options/qqq/options_*.parquet" \
            --out-dir artifacts/adaptive_leaps_replay/qqq_cash_5000 --starting-cash 5000 \
            --enforce-account-cash

      - name: Audit SPY quote continuity (diagnostic; does not gate replay)
        continue-on-error: true
        run: |
          python -m research.audit_adaptive_leaps_quote_continuity \
            --symbol SPY --source "data/options/spy/options_*.parquet" \
            --contract-ids "SPY080930C00148000" \
            --out-dir artifacts/adaptive_leaps_replay/quote_continuity

      - name: Audit QQQ quote continuity (diagnostic; does not gate replay)
        continue-on-error: true
        run: |
          python -m research.audit_adaptive_leaps_quote_continuity \
            --symbol QQQ --source "data/options/qqq/options_*.parquet" \
            --contract-ids "QQQ140920C00077000" \
            --out-dir artifacts/adaptive_leaps_replay/quote_continuity

      - name: Cross-check flagged contract cutoffs against underlying sessions (diagnostic)
        continue-on-error: true
        run: |
          python -m research.audit_adaptive_leaps_source_discontinuity \
            --symbol SPY --source "data/options/spy/options_*.parquet" \
            --underlying data/options/spy/underlying_prices.parquet \
            --out-dir artifacts/adaptive_leaps_replay/source_discontinuity
          python -m research.audit_adaptive_leaps_source_discontinuity \
            --symbol QQQ --source "data/options/qqq/options_*.parquet" \
            --underlying data/options/qqq/underlying_prices.parquet \
            --out-dir artifacts/adaptive_leaps_replay/source_discontinuity

      - name: Upload replay ledgers and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-leaps-chronological-replay
          path: artifacts/adaptive_leaps_replay/
          if-no-files-found: warn

      - name: Require reconciled terminal equity for all four replay cases
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          paths = [
              Path("artifacts/adaptive_leaps_replay/spy_theoretical/summary.json"),
              Path("artifacts/adaptive_leaps_replay/spy_cash_5000/summary.json"),
              Path("artifacts/adaptive_leaps_replay/qqq_theoretical/summary.json"),
              Path("artifacts/adaptive_leaps_replay/qqq_cash_5000/summary.json"),
          ]
          failures = []
          for path in paths:
              if not path.exists():
                  failures.append(f"{path}: summary missing")
                  continue
              summary = json.loads(path.read_text())
              diagnostics = summary.get("diagnostics", {})
              if (summary.get("status") != "completed"
                      or summary.get("final_equity") is None
                      or summary.get("final_mark_available") is not True):
                  failures.append(
                      f"{path}: status={summary.get('status')} "
                      f"final_equity={summary.get('final_equity')} "
                      f"terminal_contract={diagnostics.get('terminal_contract_id')} "
                      f"terminal_dte={diagnostics.get('terminal_dte')} "
                      f"unresolved_expired={diagnostics.get('unresolved_expired_position')} "
                      f"days_past_expiration={diagnostics.get('days_past_expiration')} "
                      f"exit_rejections={diagnostics.get('exit_rejected_observations')}"
                  )
          if failures:
              print("LEAPS REPLAY QUALITY GATE FAILED:")
              print("\\n".join(failures))
              sys.exit(1)
          print("All four replay cases have reconciled terminal equity.")
          PY

      - name: Persist final replay run receipt
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = "docs/LEAPS_REPLAY_LATEST_RUN.md";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "# Latest Adaptive LEAPS Replay Run",
              "",
              `- Run ID: ${context.runId}`,
              `- Run number: ${context.runNumber}`,
              `- Attempt: ${process.env.GITHUB_RUN_ATTEMPT || "1"}`,
              "- Workflow: Adaptive LEAPS Chronological Replay",
              `- Commit: ${context.sha}`,
              `- Ref: ${context.ref}`,
              `- Final job status at receipt step: ${process.env.JOB_STATUS}`,
              `- Run URL: ${runUrl}`,
              "- Artifact name: adaptive-leaps-chronological-replay",
              "",
              "This receipt is updated after replay and quality-gate completion, including failed runs. Treat the run page and artifact as authoritative for final job conclusions and data.",
              ""
            ].join("\n");
            for (let attempt = 0; attempt < 3; attempt++) {
              let sha;
              try {
                const current = await github.rest.repos.getContent({ owner, repo, path, ref: "main" });
                if (Array.isArray(current.data)) throw new Error("Receipt path unexpectedly resolved to a directory");
                sha = current.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, message: `Finalize Adaptive LEAPS replay receipt ${context.runId}`,
                  content: Buffer.from(body).toString("base64"), sha, branch: "main"
                });
                break;
              } catch (error) {
                if (error.status !== 409 || attempt === 2) throw error;
              }
            }
