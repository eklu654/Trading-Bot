name: Fed Macro Transmission Confirmation

on:
  push:
    paths:
      - "research/test_tqqq_fed_macro_transmission_confirmation.py"
      - "research/test_tqqq_fed_lifecycle_sticky.py"
      - "research/test_tqqq_macro_regime.py"
      - ".github/workflows/tqqq-fed-macro-transmission-confirmation.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-fed-macro-transmission-confirmation
  cancel-in-progress: false

jobs:
  transmission-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_fed_macro_transmission_confirmation.py
      - name: Run transmission confirmation
        working-directory: research
        run: python test_tqqq_fed_macro_transmission_confirmation.py
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-fed-macro-transmission-confirmation
          path: data/research/tqqq_fed_macro_transmission_confirmation_summary.csv
