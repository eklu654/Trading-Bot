name: Early Fed cross-proxy robustness
on:
  push:
    paths:
      - "research/fed_early_crossproxy.py"
      - ".github/workflows/fed-early-crossproxy.yml"
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy requests
      - run: python research/fed_early_crossproxy.py
      - uses: actions/upload-artifact@v4
        with:
          name: fed-early-crossproxy
          path: data/research/fed_early_nasdaq_crossproxy.csv
