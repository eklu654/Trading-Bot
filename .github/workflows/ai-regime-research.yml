name: E4 AI Regime Research

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_ai_action_selector.py"
      - "research/build_historical_regime_dataset.py"
      - "research/requirements.txt"
      - "tests/test_backtest_ai_action_selector.py"
      - "docs/02-research/e4-ai-regime-action-selector.md"
      - ".github/workflows/ai-regime-research.yml"

jobs:
  e4-ai-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile research/backtest_ai_action_selector.py
      - name: Run E4 unit tests
        run: python -m pytest -q tests/test_backtest_ai_action_selector.py
      - name: Build historical market dataset
        run: python research/build_historical_regime_dataset.py
      - name: Run E4 Ridge walk-forward research
        run: python research/backtest_ai_action_selector.py
      - name: Print E4 summary
        run: cat data/research/e4_ai_summary.csv
      - name: Print E4 annual results
        run: cat data/research/e4_ai_annual_returns.csv
      - name: Upload E4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e4-ai-regime-research
          path: |
            data/research/e4_ai_features.csv
            data/research/e4_ai_action_targets.csv
            data/research/e4_ai_predictions.csv
            data/research/e4_ai_backtest.csv
            data/research/e4_ai_summary.csv
            data/research/e4_ai_annual_returns.csv
            data/research/e4_ai_action_frequency.csv
          if-no-files-found: error
