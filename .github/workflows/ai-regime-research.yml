name: E4 AI Regime Research

on:
  workflow_dispatch:
  schedule:
    - cron: "7/5 * * * *"
  issues:
    types: [opened]
  push:
    paths:
      - "research/backtest_ai_action_selector.py"
      - "research/backtest_ai_hgb_selector.py"
      - "research/backtest_ai_risk_aware_selector.py"
      - "research/analyze_e4c_fixed_controls.py"
      - "research/analyze_e4c_cap_diagnostics.py"
      - "research/backtest_ai_meta_selector.py"
      - "research/backtest_ai_e2_overlay.py"
      - "research/analyze_e6_overlay.py"
      - "research/analyze_e4_risk_overlays.py"
      - "research/build_historical_regime_dataset.py"
      - "research/requirements.txt"
      - "tests/test_backtest_ai_action_selector.py"
      - "tests/test_backtest_ai_hgb_selector.py"
      - "tests/test_backtest_ai_risk_aware_selector.py"
      - "tests/test_backtest_ai_meta_selector.py"
      - "tests/test_backtest_ai_e2_overlay.py"
      - "docs/02-research/e4-ai-regime-action-selector.md"
      - ".github/workflows/ai-regime-research.yml"

concurrency:
  group: e4-e6-research
  cancel-in-progress: false

jobs:
  trigger-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      issue_number: ${{ steps.gate.outputs.issue_number }}
    steps:
      - name: Determine whether this invocation should execute research
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "schedule") {
              core.setOutput("run", "true");
              core.setOutput("issue_number", context.issue?.number ? String(context.issue.number) : "");
              return;
            }
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const issue = data.find(i => !i.pull_request && i.title === "[RUN-E4-E6]");
            core.setOutput("run", issue ? "true" : "false");
            core.setOutput("issue_number", issue ? String(issue.number) : "");
            if (issue) {
              core.info("Found open research trigger issue #" + issue.number + "; starting scheduled research run.");
            } else {
              core.info("No open [RUN-E4-E6] trigger issue; scheduled invocation will exit without research.");
            }

  e4-ai-research:
    needs: trigger-gate
    if: needs.trigger-gate.outputs.run == 'true' && (github.event_name != 'issues' || github.event.issue.title == '[RUN-E4-E6]')
    runs-on: ubuntu-latest
    steps:
      - name: Mark trigger started
        if: github.event_name == 'issues' || (github.event_name == 'schedule' && needs.trigger-gate.outputs.issue_number != '')
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === "issues" ? context.issue.number : Number("${{ needs.trigger-gate.outputs.issue_number }}");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: "E4/E6 research workflow started."
            });
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt -r requirements-dev.txt
      - name: Compile research modules
        run: python -m py_compile research/backtest_ai_action_selector.py research/backtest_ai_meta_selector.py research/backtest_ai_e2_overlay.py research/analyze_e6_overlay.py
      - name: Run E4 unit tests
        run: python -m pytest -q tests/test_backtest_ai_action_selector.py tests/test_backtest_ai_hgb_selector.py tests/test_backtest_ai_risk_aware_selector.py tests/test_backtest_ai_meta_selector.py tests/test_backtest_ai_e2_overlay.py
      - name: Build historical market dataset
        run: python research/build_historical_regime_dataset.py
      - name: Run E6 AI E2-overlay research
        run: python research/backtest_ai_e2_overlay.py
      - name: Print E6 summary
        run: cat data/research/e6_summary.csv
      - name: Analyze E6 overlay versus frozen E2
        run: python research/analyze_e6_overlay.py
      - name: Print E6 incremental diagnostics
        run: cat data/research/e6_incremental_summary.csv && cat data/research/e6_incremental_stress.csv
      - name: Run E5 AI meta-selector research
        run: python research/backtest_ai_meta_selector.py
      - name: Print E5 summary
        run: cat data/research/e5_summary.csv
      - name: Run E4 Ridge walk-forward research
        run: python research/backtest_ai_action_selector.py
      - name: Run E4b HGB walk-forward research
        run: python research/backtest_ai_hgb_selector.py
      - name: Print E4b HGB summary
        run: cat data/research/e4b_hgb_summary.csv
      - name: Run E4c risk-aware Ridge research
        run: python research/backtest_ai_risk_aware_selector.py
      - name: Print E4c summary
        run: cat data/research/e4c_risk_aware_summary.csv
      - name: Analyze E4c capped-policy diagnostics
        run: python research/analyze_e4c_cap_diagnostics.py
      - name: Print E4c capped-policy diagnostics
        run: cat data/research/e4c_cap_rolling.csv && cat data/research/e4c_cap_stress.csv
      - name: Analyze E4c fixed controls
        run: python research/analyze_e4c_fixed_controls.py
      - name: Print E4c fixed controls
        run: cat data/research/e4c_fixed_control_summary.csv
      - name: Analyze fixed E4 risk overlays
        run: python research/analyze_e4_risk_overlays.py
      - name: Print E4 summary
        run: cat data/research/e4_ai_summary.csv
      - name: Print E4 risk overlay summary
        run: cat data/research/e4_ai_risk_overlay_summary.csv
      - name: Print E4 risk overlay splits
        run: cat data/research/e4_ai_risk_overlay_splits.csv
      - name: Print E4 annual results
        run: cat data/research/e4_ai_annual_returns.csv
      - name: Mark trigger completed
        if: always() && (github.event_name == 'issues' || (github.event_name == 'schedule' && needs.trigger-gate.outputs.issue_number != ''))
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === "issues" ? context.issue.number : Number("${{ needs.trigger-gate.outputs.issue_number }}");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: "E4/E6 research workflow completed."
            });
            if (context.eventName === "schedule") {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: "closed"
              });
            }
      - name: Upload E4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e4-ai-regime-research
          path: |
            data/research/e4_ai_features.csv
            data/research/e4_ai_action_targets.csv
            data/research/e4_ai_predictions.csv
            data/research/e4_ai_backtest.csv
            data/research/e4_ai_summary.csv
            data/research/e4_ai_annual_returns.csv
            data/research/e4_ai_action_frequency.csv
            data/research/e4_ai_risk_overlay_summary.csv
            data/research/e4_ai_risk_overlay_splits.csv
            data/research/e4_ai_risk_overlay_stress.csv
            data/research/e4b_hgb_predictions.csv
            data/research/e4b_hgb_backtest.csv
            data/research/e4b_hgb_summary.csv
            data/research/e4b_hgb_annual_returns.csv
            data/research/e4b_hgb_action_frequency.csv
            data/research/e4c_risk_aware_targets.csv
            data/research/e4c_risk_aware_predictions.csv
            data/research/e4c_risk_aware_backtest.csv
            data/research/e4c_risk_aware_cap2x_backtest.csv
            data/research/e4c_risk_aware_cap1x_backtest.csv
            data/research/e4c_risk_aware_cost_sensitivity.csv
            data/research/e4c_fixed_control_summary.csv
            data/research/e4c_cap_rolling.csv
            data/research/e4c_cap_annual.csv
            data/research/e4c_cap_stress.csv
            data/research/e5_sleeve_returns.csv
            data/research/e5_sleeve_targets.csv
            data/research/e5_predictions.csv
            data/research/e5_backtest.csv
            data/research/e5_summary.csv
            data/research/e5_annual_returns.csv
            data/research/e5_sleeve_frequency.csv
            data/research/e6_e2_baseline.csv
            data/research/e6_target.csv
            data/research/e6_predictions.csv
            data/research/e6_backtest.csv
            data/research/e6_summary.csv
            data/research/e6_action_frequency.csv
            data/research/e6_incremental_summary.csv
            data/research/e6_incremental_stress.csv
            data/research/e4c_risk_aware_summary.csv
            data/research/e4c_risk_aware_annual_returns.csv
            data/research/e4c_risk_aware_action_frequency.csv
          if-no-files-found: error
