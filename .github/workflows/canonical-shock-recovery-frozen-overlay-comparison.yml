name: Canonical shock recovery — frozen-input overlay comparison

on:
  push:
    branches: [main]
    paths:
      - "research/canonical_shock_recovery_frozen_overlay_comparison.py"
      - "research/tqqq_canonical_same_input_reconciliation.py"
      - "research/canonical_shock_recovery_fed_dma_overlay.py"
      - "research/canonical_shock_recovery_active_tightening_overlay.py"
      - "research/causal_execution.py"
      - "research/requirements.txt"
      - ".github/workflows/canonical-shock-recovery-frozen-overlay-comparison.yml"
  workflow_dispatch:

concurrency:
  group: canonical-shock-recovery-frozen-overlay-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile research code
        run: |
          python -m py_compile research/canonical_shock_recovery_frozen_overlay_comparison.py
          python -m py_compile research/tqqq_canonical_same_input_reconciliation.py
          python -m py_compile research/canonical_shock_recovery_fed_dma_overlay.py
          python -m py_compile research/canonical_shock_recovery_active_tightening_overlay.py
          python -m py_compile research/causal_execution.py
      - name: Run one-frozen-input candidate comparison
        env:
          PYTHONPATH: research
        run: python research/canonical_shock_recovery_frozen_overlay_comparison.py
      - name: Upload complete comparison audit
        uses: actions/upload-artifact@v4
        with:
          name: canonical-shock-recovery-frozen-overlay-comparison
          if-no-files-found: error
          path: |
            data/research/tqqq_canonical_frozen_common_input.csv
            data/research/canonical_frozen_overlay_comparison_manifest.json
            data/research/canonical_frozen_overlay_comparison_summary.csv
            data/research/canonical_frozen_overlay_comparison_periods.csv
            data/research/canonical_frozen_overlay_comparison_costs.csv
            data/research/canonical_frozen_overlay_comparison_episode_contributions.csv
            data/research/canonical_frozen_overlay_comparison_daily.csv
            data/research/canonical_frozen_overlay_comparison_events.csv
            data/research/canonical_frozen_overlay_comparison_fed_dma_transitions.csv
            data/research/canonical_frozen_overlay_comparison_fed_state.csv
