name: Crash Path Structural Override

on:
  workflow_dispatch:
  push:
    paths:
      - "research/crash_path_structural_override.py"
      - ".github/workflows/crash-path-structural-override.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -q numpy pandas yfinance
      - name: Run crash-path classification
        run: python research/crash_path_structural_override.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: crash-path-structural-override
          path: data/research/crash_path_*.csv
