name: Composite Structural Defense Chronological Robustness

on:
  push:
    paths:
      - "research/analyze_tqqq_composite_structural_chronological.py"
      - "research/test_tqqq_composite_structural_defense.py"
      - "research/test_tqqq_fed_paused_dma_sticky.py"
      - "research/test_tqqq_macro_regime.py"
      - ".github/workflows/tqqq-composite-structural-chronological.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-composite-structural-chronological
  cancel-in-progress: false

jobs:
  chronological:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/analyze_tqqq_composite_structural_chronological.py
      - name: Run chronological robustness report
        run: PYTHONPATH=. python research/analyze_tqqq_composite_structural_chronological.py
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-composite-structural-chronological
          path: data/research/tqqq_composite_structural_defense_chronological.csv
