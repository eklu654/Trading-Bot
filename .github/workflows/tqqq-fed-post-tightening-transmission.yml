name: Fed Post Tightening Transmission

on:
  push:
    paths:
      - "research/test_tqqq_fed_post_tightening_transmission.py"
      - "research/test_tqqq_fed_lifecycle_sticky.py"
      - "research/test_tqqq_macro_regime.py"
      - ".github/workflows/tqqq-fed-post-tightening-transmission.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-fed-post-tightening-transmission
  cancel-in-progress: false

jobs:
  post-tightening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_fed_post_tightening_transmission.py
      - name: Run post-tightening study
        working-directory: research
        run: python test_tqqq_fed_post_tightening_transmission.py
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-fed-post-tightening-transmission
          path: data/research/tqqq_fed_post_tightening_transmission_summary.csv
