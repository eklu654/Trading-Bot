name: Fed State Timing Sensitivity

on:
  push:
    paths:
      - "research/fed_timing_sensitivity.py"
      - "research/canonical_shock_recovery_fed_dma_overlay.py"
      - "research/causal_execution.py"
      - ".github/workflows/fed-timing-sensitivity.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: fed-state-timing-sensitivity
  cancel-in-progress: false

jobs:
  timing-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile diagnostic
        run: python -m py_compile research/fed_timing_sensitivity.py research/canonical_shock_recovery_fed_dma_overlay.py
      - name: Compare zero-lag sensitivity with one-session-lag control
        run: python research/fed_timing_sensitivity.py
      - name: Upload timing sensitivity ledger
        uses: actions/upload-artifact@v4
        with:
          name: fed-state-timing-sensitivity
          if-no-files-found: error
          path: |
            data/research/fed_timing_sensitivity_summary.csv
            data/research/fed_timing_sensitivity_daily.csv
            data/research/fed_timing_sensitivity_manifest.json
