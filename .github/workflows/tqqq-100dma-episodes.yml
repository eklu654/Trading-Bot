name: TQQQ 100-DMA Episode Attribution

on:
  push:
    paths:
      - "research/analyze_tqqq_100dma_episodes.py"
      - ".github/workflows/tqqq-100dma-episodes.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-100dma-episodes
  cancel-in-progress: false

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/analyze_tqqq_100dma_episodes.py
      - name: Run episode attribution
        run: python research/analyze_tqqq_100dma_episodes.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-100dma-episode-attribution
          path: |
            data/research/tqqq_100dma_episode_attribution.csv
            data/research/tqqq_100dma_episode_attribution_summary.csv
            data/research/tqqq_100dma_episode_crisis_windows.csv
