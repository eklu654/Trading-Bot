name: ETF-023 Walk-Forward Cadence Sensitivity

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_etf023_walk_forward_cadence_sensitivity.py"
      - ".github/workflows/etf023-walk-forward-cadence.yml"

concurrency:
  group: etf023-cadence-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  cadence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research/requirements.txt
      - name: Build focused dataset
        run: python research/build_etf020_dataset.py
      - name: Run ETF-023 cadence sensitivity
        working-directory: research
        env:
          PYTHONPATH: .
        run: python backtest_etf023_walk_forward_cadence_sensitivity.py
