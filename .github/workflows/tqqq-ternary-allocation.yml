name: TQQQ ternary allocation research
on:
  push:
    paths:
      - "research/tqqq_ternary_allocation_surface.py"
      - "research/causal_execution.py"
      - ".github/workflows/tqqq-ternary-allocation.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_ternary_allocation_surface.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-ternary-allocation
          path: data/research/tqqq_ternary_allocation_surface.csv
      - name: Publish result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/tqqq_ternary_allocation_surface.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: publish ternary allocation result"
            git push
          fi
