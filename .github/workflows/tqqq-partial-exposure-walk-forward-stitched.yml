name: TQQQ Partial Exposure Walk-Forward Stitched
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - research/test_tqqq_partial_exposure_walk_forward_stitched.py
      - .github/workflows/tqqq-partial-exposure-walk-forward-stitched.yml
permissions:
  contents: read
jobs:
  stitched:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/requirements.txt -r requirements-dev.txt
      - name: Build canonical TQQQ snapshot
        run: |
          git show 645f332bb95ad39de046378ec6262122f4c7d7cc:research/build_historical_regime_dataset.py > research/_frozen_etf031_dataset_builder.py
          python research/_frozen_etf031_dataset_builder.py --symbols TQQQ
          rm research/_frozen_etf031_dataset_builder.py
      - name: Run stitched research
        run: python research/test_tqqq_partial_exposure_walk_forward_stitched.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-partial-exposure-walk-forward-stitched
          path: |
            data/research/tqqq_partial_exposure_walk_forward_stitched.csv
            data/research/tqqq_partial_exposure_walk_forward_stitched_windows.csv
          if-no-files-found: error
