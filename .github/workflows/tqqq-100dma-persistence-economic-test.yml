name: TQQQ 100-DMA Persistence Economic Test
on:
  push:
    paths:
      - "research/analyze_tqqq_100dma_persistence_economic_test.py"
      - "research/requirements.txt"
      - ".github/workflows/tqqq-100dma-persistence-economic-test.yml"
  workflow_dispatch:
concurrency:
  group: tqqq-100dma-persistence-economic-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/analyze_tqqq_100dma_persistence_economic_test.py
      - run: python research/analyze_tqqq_100dma_persistence_economic_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-100dma-persistence-economic-test
          path: |
            data/research/tqqq_100dma_persistence_adaptive_equity.csv
            data/research/tqqq_100dma_persistence_adaptive_summary.csv
