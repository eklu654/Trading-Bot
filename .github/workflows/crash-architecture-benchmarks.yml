name: Crash architecture benchmarks
on:
  push:
    paths:
      - "research/crash_architecture_benchmarks.py"
      - ".github/workflows/crash-architecture-benchmarks.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/crash_architecture_benchmarks.py
      - uses: actions/upload-artifact@v4
        with:
          name: crash-architecture-benchmarks
          path: data/research/crash_architecture_benchmarks.csv
