name: DMA Bull Cash Bear Switching Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/test_dma_bull_bear_switching.py"
      - "research/backtest_dynamic_leverage.py"
      - "research/build_historical_regime_dataset.py"
      - "research/requirements.txt"
      - ".github/workflows/dma-bull-bear-switching.yml"

concurrency:
  group: dma-bull-bear-switching-${{ github.ref }}
  cancel-in-progress: true

jobs:
  switching:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: research/requirements.txt
      - name: Cache historical research dataset
        id: dataset-cache
        uses: actions/cache@v4
        with:
          path: data/research
          key: dma-bull-bear-dataset-${{ hashFiles('research/build_historical_regime_dataset.py') }}-2026-10-03
      - run: python -m pip install -r research/requirements.txt
      - name: Build historical market dataset
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: python research/build_historical_regime_dataset.py
      - name: Run bull/cash/bear switching matrix
        run: python research/test_dma_bull_bear_switching.py
      - name: Upload switching results
        uses: actions/upload-artifact@v4
        with:
          name: dma-bull-bear-switching-results
          path: |
            data/research/dma_bull_bear_switch_combined_holdout.csv
            data/research/dma_bull_bear_switch_matrix.csv
            data/research/dma_bull_bear_switch_annual_returns.csv
            data/research/dma_bull_bear_switch_headline_holdout.csv
            data/research/dma_bull_bear_switch_combined_splits.csv
            data/research/dma_bull_bear_switch_cost_stress.csv
