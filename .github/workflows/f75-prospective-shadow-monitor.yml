name: F75 Prospective Shadow Monitor

on:
  push:
    paths:
      - "research/f75_prospective_shadow_monitor.py"
      - "research/test_f75_prospective_shadow_monitor.py"
      - ".github/workflows/f75-prospective-shadow-monitor.yml"
      - "research/canonical_shock_recovery_fed_dma_overlay.py"
      - "research/canonical_shock_recovery_active_tightening_overlay.py"
      - "research/causal_execution.py"
      - "research/requirements.txt"
  workflow_dispatch:
  schedule:
    - cron: "35 22 * * 1-5"

permissions:
  contents: write
  actions: read

concurrency:
  group: f75-prospective-shadow-monitor
  cancel-in-progress: false

jobs:
  shadow-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/qqq-slow-bear-audit
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Download immutable canonical B0 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38117700318 --repo eklu654/Trading-Bot --name tqqq-actual-partial-dma-matrix --dir data/research/canonical_b0
      - name: Compile and test shadow monitor
        run: |
          python -m py_compile research/f75_prospective_shadow_monitor.py
          python -m unittest discover -s research -p "test_f75_prospective_shadow_monitor.py" -v
      - name: Append new completed market sessions
        run: python research/f75_prospective_shadow_monitor.py
      - name: Commit append-only shadow ledger
        run: |
          if git diff --quiet -- data/research/f75_shadow_daily_ledger.csv data/research/f75_shadow_state.json; then
            echo "No new completed sessions; ledger unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/research/f75_shadow_daily_ledger.csv data/research/f75_shadow_state.json
            git commit -m "research: append F75 shadow observation"
            git push origin HEAD:research/qqq-slow-bear-audit
          fi
