name: Fed Curve Weekly Reentry

on:
  push:
    paths:
      - "research/test_tqqq_fed_curve_weekly_reentry.py"
      - "research/test_tqqq_fed_lifecycle_sticky.py"
      - "research/test_tqqq_macro_regime.py"
      - ".github/workflows/tqqq-fed-curve-weekly-reentry.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-fed-curve-weekly-reentry
  cancel-in-progress: false

jobs:
  weekly-reentry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_fed_curve_weekly_reentry.py
      - name: Run weekly reentry test
        working-directory: research
        run: python test_tqqq_fed_curve_weekly_reentry.py
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-fed-curve-weekly-reentry
          path: data/research/tqqq_fed_curve_weekly_reentry_summary.csv
