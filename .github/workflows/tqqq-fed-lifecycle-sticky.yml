name: Fed Lifecycle Sticky Defense Backtest

on:
  push:
    paths:
      - "research/test_tqqq_fed_lifecycle_sticky.py"
      - ".github/workflows/tqqq-fed-lifecycle-sticky.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-fed-lifecycle-sticky
  cancel-in-progress: false

jobs:
  sticky-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_fed_lifecycle_sticky.py
      - name: Run sticky backtest
        run: python research/test_tqqq_fed_lifecycle_sticky.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-fed-lifecycle-sticky
          path: data/research/tqqq_fed_lifecycle_sticky_*.csv
