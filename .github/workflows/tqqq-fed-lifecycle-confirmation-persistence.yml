name: Fed Lifecycle Structural Confirmation

on:
  push:
    paths:
      - "research/test_tqqq_fed_lifecycle_confirmation_persistence.py"
      - "research/test_tqqq_fed_lifecycle_sticky.py"
      - ".github/workflows/tqqq-fed-lifecycle-confirmation-persistence.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-fed-lifecycle-confirmation-persistence
  cancel-in-progress: false

jobs:
  structural-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_fed_lifecycle_confirmation_persistence.py
      - name: Run structural confirmation test
        working-directory: research
        run: python test_tqqq_fed_lifecycle_confirmation_persistence.py
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-fed-lifecycle-confirmation-persistence
          path: data/research/tqqq_fed_lifecycle_confirmation_persistence_summary.csv
