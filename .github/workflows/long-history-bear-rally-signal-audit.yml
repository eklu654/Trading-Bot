name: Long-history bear-rally signal audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas yfinance
      - name: Run S&P 500 signal-only historical audit
        run: PYTHONPATH=research python research/long_history_bear_rally_signal_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: long-history-bear-rally-signal-audit
          path: |
            data/research/long_history_bear_rally_events.csv
            data/research/long_history_bear_rally_period_summary.csv
            data/research/long_history_bear_rally_feature_separation.csv
            data/research/long_history_bear_rally_manifest.json
