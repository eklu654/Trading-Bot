name: Crash persistent bear filter
on:
  push:
    paths:
      - "research/crash_persistent_bear_filter.py"
      - ".github/workflows/crash-persistent-bear-filter.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/crash_persistent_bear_filter.py
      - uses: actions/upload-artifact@v4
        with:
          name: crash-persistent-bear-filter
          path: data/research/crash_persistent_bear_filter.csv
      - name: Publish result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/crash_persistent_bear_filter.csv
          git diff --cached --quiet || (git commit -m "research: publish persistent bear filter" && git push)
