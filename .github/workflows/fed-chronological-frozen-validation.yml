name: Frozen Fed chronological validation
on:
  push:
    paths:
      - "research/fed_chronological_frozen_validation.py"
      - ".github/workflows/fed-chronological-frozen-validation.yml"
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance requests
      - run: PYTHONPATH=research python research/fed_chronological_frozen_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: fed-chronological-frozen-validation
          path: data/research/fed_chronological_frozen_*
