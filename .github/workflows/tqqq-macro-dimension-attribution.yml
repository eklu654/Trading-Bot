name: TQQQ Macro Dimension Attribution

on:
  push:
    paths:
      - "research/analyze_tqqq_macro_dimension_attribution.py"
      - "research/test_tqqq_macro_regime.py"
      - ".github/workflows/tqqq-macro-dimension-attribution.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-macro-dimension-attribution
  cancel-in-progress: false

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/analyze_tqqq_macro_dimension_attribution.py
      - name: Run macro dimension attribution
        run: PYTHONPATH=. python research/analyze_tqqq_macro_dimension_attribution.py
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-macro-dimension-attribution
          path: |
            data/research/tqqq_macro_dimension_attribution.csv
            data/research/tqqq_macro_dimension_attribution_paths.csv
