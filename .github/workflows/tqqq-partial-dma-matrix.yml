name: TQQQ partial DMA matrix
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_partial_dma_matrix.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-partial-dma-matrix
          path: |
            data/research/tqqq_partial_dma_matrix.csv
            data/research/tqqq_partial_dma_periods.csv
