name: TQQQ 100-DMA market-confirmation re-entry
on:
  push:
    paths:
      - "research/tqqq_100dma_market_confirmation_reentry.py"
      - "research/causal_execution.py"
      - ".github/workflows/tqqq-100dma-market-confirmation-reentry.yml"
  workflow_dispatch:
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_100dma_market_confirmation_reentry.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-100dma-market-confirmation-reentry
          path: data/research/tqqq_100dma_market_confirmation_reentry.csv
