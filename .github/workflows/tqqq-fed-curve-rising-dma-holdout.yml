name: Fed Curve Rising DMA Holdout

on:
  push:
    paths:
      - "research/test_tqqq_fed_curve_rising_dma_holdout.py"
      - "research/test_tqqq_fed_lifecycle_sticky.py"
      - "research/test_tqqq_macro_regime.py"
      - ".github/workflows/tqqq-fed-curve-rising-dma-holdout.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-fed-curve-rising-dma-holdout
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_fed_curve_rising_dma_holdout.py
      - name: Run chronological holdout
        working-directory: research
        run: python test_tqqq_fed_curve_rising_dma_holdout.py
      - name: Upload holdout artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-fed-curve-rising-dma-holdout
          path: |
            data/research/tqqq_fed_curve_rising_dma_holdout_summary.csv
            data/research/tqqq_fed_curve_rising_dma_candidate_equity.csv
            data/research/tqqq_fed_curve_rising_dma_candidate_exposure.csv
