name: TQQQ sparse inverse switch
on:
  push:
    paths:
      - "research/tqqq_sparse_inverse_switch.py"
      - ".github/workflows/tqqq-sparse-inverse-switch.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_sparse_inverse_switch.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-sparse-inverse-switch
          path: data/research/tqqq_sparse_inverse_switch.csv
      - name: Publish result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+eklu654@users.noreply.github.com"
          git add data/research/tqqq_sparse_inverse_switch.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: publish sparse inverse switch"
            git push
          fi
