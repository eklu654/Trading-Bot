name: TQQQ drawdown candidate validation

on:
  push:
    paths:
      - "research/tqqq_drawdown_candidate_validation.py"
      - "research/causal_execution.py"
      - ".github/workflows/tqqq-drawdown-candidate-validation.yml"
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python -m pip install -r research/requirements.txt
      - run: PYTHONPATH=. python research/tqqq_drawdown_candidate_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-drawdown-candidate-validation
          path: |
            data/research/tqqq_drawdown_candidate_validation_summary.csv
            data/research/tqqq_drawdown_candidate_validation_annual.csv
            data/research/tqqq_drawdown_candidate_validation_transitions.csv
