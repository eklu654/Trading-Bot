name: TQQQ Dot-Com Survivability Research

on:
  push:
    paths:
      - "research/test_tqqq_dotcom_survivability.py"
      - "research/synthetic_b0_unified_survivability.py"
      - "tests/test_synthetic_b0_unified_survivability.py"
      - ".github/workflows/tqqq-dotcom-survivability.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-dotcom-survivability
  cancel-in-progress: false

jobs:
  survivability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: |
          python -m py_compile research/test_tqqq_dotcom_survivability.py
          python -m py_compile research/synthetic_b0_unified_survivability.py
      - name: Run existing dot-com survivability research
        run: python research/test_tqqq_dotcom_survivability.py
      - name: Run unified B0 versus synthetic buy-and-hold replay
        run: python research/synthetic_b0_unified_survivability.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-dotcom-survivability
          path: |
            data/research/tqqq_dotcom_survivability_summary.csv
            data/research/tqqq_dotcom_survivability_paths.csv
            data/research/tqqq_dotcom_survivability_dotcom_slice.csv
            data/research/qqq_synthetic_tqqq_history.csv

# Research rerun marker: independently reproduce 100-DMA result.
