name: TQQQ Dot-Com Survivability Research

on:
  push:
    paths:
      - "research/test_tqqq_dotcom_survivability.py"
      - "research/synthetic_b0_unified_survivability.py"
      - "research/b0_250dma_hybrid_validation.py"
      - "research/b0_fed200_hybrid_validation.py"
      - "research/b0_vix30_hybrid_validation.py"
      - "research/b0_control_window_cost_reconciliation.py"
      - "research/tqqq_canonical_same_input_reconciliation.py"
      - "research/causal_execution.py"
      - "tests/test_b0_control_window_cost_reconciliation.py"
      - "tests/test_b0_vix30_hybrid.py"
      - "tests/test_b0_fed200_hybrid.py"
      - "tests/test_b0_250dma_hybrid.py"
      - "tests/test_synthetic_b0_unified_survivability.py"
      - ".github/workflows/tqqq-dotcom-survivability.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-dotcom-survivability
  cancel-in-progress: false

jobs:
  survivability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: |
          python -m py_compile research/test_tqqq_dotcom_survivability.py
          python -m py_compile research/synthetic_b0_unified_survivability.py
          python -m py_compile research/b0_250dma_hybrid_validation.py
          python -m py_compile research/b0_fed200_hybrid_validation.py
          python -m py_compile research/b0_vix30_hybrid_validation.py
          python -m py_compile research/b0_control_window_cost_reconciliation.py
      - name: Run existing dot-com survivability research
        run: python research/test_tqqq_dotcom_survivability.py
      - name: Run unified B0 versus synthetic buy-and-hold replay
        run: python research/synthetic_b0_unified_survivability.py
      - name: Run preregistered B0 plus 250-DMA hybrid validation
        run: python research/b0_250dma_hybrid_validation.py
      - name: Run preregistered B0 plus Fed-hike/200-DMA validation
        run: python research/b0_fed200_hybrid_validation.py
      - name: Run preregistered B0 plus VIX-30 validation
        run: python research/b0_vix30_hybrid_validation.py
      - name: Reconcile B0 windows and transaction costs
        run: python research/b0_control_window_cost_reconciliation.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-dotcom-survivability
          path: |
            data/research/tqqq_dotcom_survivability_summary.csv
            data/research/tqqq_dotcom_survivability_paths.csv
            data/research/tqqq_dotcom_survivability_dotcom_slice.csv
            data/research/qqq_synthetic_tqqq_history.csv
            data/research/synthetic_b0_survivability_frozen_qqq.csv
            data/research/synthetic_b0_survivability_summary.csv
            data/research/synthetic_b0_survivability_paths.csv
            data/research/b0_250dma_hybrid_frozen_qqq.csv
            data/research/b0_250dma_hybrid_frozen_actual_tqqq.csv
            data/research/b0_250dma_hybrid_summary.csv
            data/research/b0_250dma_hybrid_paths_0_10bps.csv
            data/research/b0_fed200_hybrid_frozen_qqq.csv
            data/research/b0_fed200_hybrid_frozen_actual_tqqq.csv
            data/research/b0_fed200_hybrid_summary.csv
            data/research/b0_fed200_hybrid_paths_0_10bps.csv
            data/research/b0_vix30_hybrid_frozen_qqq.csv
            data/research/b0_vix30_hybrid_frozen_actual_tqqq.csv
            data/research/b0_vix30_hybrid_summary.csv
            data/research/b0_vix30_hybrid_paths_0_10bps.csv
            data/research/tqqq_canonical_frozen_common_input.csv
            data/research/b0_control_window_cost_reconciliation_summary.csv
            data/research/b0_control_window_cost_reconciliation_paths.csv
            data/research/b0_control_window_cost_reconciliation_events.csv
            data/research/b0_control_window_cost_reconciliation_manifest.json
          if-no-files-found: error

# Research rerun marker: independently reproduce 100-DMA result.
