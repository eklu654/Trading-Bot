name: Canonical Shock Recovery — Fed State Attribution

on:
  push:
    paths:
      - "research/canonical_shock_recovery_fed_state_attribution.py"
      - "research/canonical_shock_recovery_fed_dma_overlay.py"
      - "research/causal_execution.py"
      - ".github/workflows/canonical-shock-recovery-fed-state-attribution.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: canonical-shock-recovery-fed-state-attribution
  cancel-in-progress: false

jobs:
  attribute-fed-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile research scripts
        run: python -m py_compile research/canonical_shock_recovery_fed_state_attribution.py research/canonical_shock_recovery_fed_dma_overlay.py research/causal_execution.py
      - name: Run diagnostic attribution only
        run: python research/canonical_shock_recovery_fed_state_attribution.py
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canonical-shock-recovery-fed-state-attribution
          if-no-files-found: error
          path: |
            data/research/canonical_fed_state_attribution_frozen_inputs.csv
            data/research/canonical_fed_state_attribution_episodes.csv
            data/research/canonical_fed_state_attribution_baseline_events.csv
            data/research/canonical_fed_state_attribution_transitions.csv
            data/research/canonical_fed_state_attribution_manifest.json
