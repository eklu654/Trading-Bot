name: ETF Signal Research

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_etf010_bear_gate.py"
      - "research/backtest_etf011_partial_inverse.py"
      - "research/backtest_etf012_early_bear_override.py"
      - "research/backtest_etf013_absolute_vix_early_bear.py"
      - "research/backtest_etf014_inverse_instrument_grid.py"
      - ".github/workflows/etf-signal-research.yml"

jobs:
  signal-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research/requirements.txt
      - run: python research/build_historical_regime_dataset.py
      - name: Run ETF-010 rare-event bear gate
        run: python research/backtest_etf010_bear_gate.py

      - name: Run ETF-011 partial inverse overlay
        run: python research/backtest_etf011_partial_inverse.py
      - name: Run ETF-012 early bear override
        run: python research/backtest_etf012_early_bear_override.py
      - name: Run ETF-013 absolute VIX early bear override
        run: python research/backtest_etf013_absolute_vix_early_bear.py
      - name: Run ETF-014 inverse instrument grid
        run: python research/backtest_etf014_inverse_instrument_grid.py
