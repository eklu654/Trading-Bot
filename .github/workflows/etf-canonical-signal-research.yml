name: ETF Canonical Signal Research

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_etf017_canonical_early_bear_override.py"
      - "research/build_historical_regime_dataset.py"
      - ".github/workflows/etf-canonical-signal-research.yml"

concurrency:
  group: etf-canonical-signal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research/requirements.txt
      - run: python research/build_historical_regime_dataset.py
      - name: Run ETF-017 canonical early bear override
        run: python research/backtest_etf017_canonical_early_bear_override.py
