name: Fed Paused x DMA Sticky Defense Study

on:
  push:
    paths:
      - "research/test_tqqq_fed_paused_dma_sticky.py"
      - ".github/workflows/tqqq-fed-paused-dma-sticky.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-fed-paused-dma-sticky
  cancel-in-progress: false

jobs:
  fed-paused-dma-sticky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_fed_paused_dma_sticky.py
      - name: Run sticky defense study
        run: python research/test_tqqq_fed_paused_dma_sticky.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-fed-paused-dma-sticky
          path: |
            data/research/tqqq_fed_paused_dma_sticky_daily_states.csv
            data/research/tqqq_fed_paused_dma_sticky_summary.csv
            data/research/tqqq_fed_paused_dma_sticky_transitions.csv
            data/research/tqqq_fed_paused_dma_sticky_paths.csv
