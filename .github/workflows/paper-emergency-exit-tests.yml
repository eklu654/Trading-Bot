name: Paper Emergency Exit Core Tests

on:
  push:
    branches: [main]
    paths:
      - "research/paper_emergency_exit.py"
      - "research/test_paper_emergency_exit.py"
      - "research/paper_virtual_portfolio.py"
      - "research/test_paper_virtual_portfolio.py"
      - "research/record_emergency_exit_latch.py"
      - "research/test_record_emergency_exit_latch.py"
      - "research/alpaca_paper_order_executor.py"
      - "research/test_alpaca_paper_order_executor.py"
      - ".github/workflows/paper-emergency-exit-tests.yml"
  pull_request:
    paths:
      - "research/paper_emergency_exit.py"
      - "research/test_paper_emergency_exit.py"
      - "research/paper_virtual_portfolio.py"
      - "research/test_paper_virtual_portfolio.py"
      - "research/record_emergency_exit_latch.py"
      - "research/test_record_emergency_exit_latch.py"
      - "research/alpaca_paper_order_executor.py"
      - "research/test_alpaca_paper_order_executor.py"
      - ".github/workflows/paper-emergency-exit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile emergency exit and ledger components
        run: python -m py_compile research/paper_emergency_exit.py research/paper_virtual_portfolio.py research/record_emergency_exit_latch.py research/alpaca_paper_order_executor.py
      - name: Run emergency-exit core safety tests
        env:
          PYTHONPATH: research
        run: python -m unittest -v test_paper_emergency_exit
      - name: Run durable ledger and latch tests
        env:
          PYTHONPATH: research
        run: |
          python research/test_paper_virtual_portfolio.py
          python research/test_record_emergency_exit_latch.py
          python research/test_alpaca_paper_order_executor.py
