name: Paper Emergency Exit Core Tests

on:
  push:
    branches: [main]
    paths:
      - "research/paper_emergency_exit.py"
      - "research/test_paper_emergency_exit.py"
      - ".github/workflows/paper-emergency-exit-tests.yml"
  pull_request:
    paths:
      - "research/paper_emergency_exit.py"
      - "research/test_paper_emergency_exit.py"
      - ".github/workflows/paper-emergency-exit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile paper-only emergency exit core
        run: python -m py_compile research/paper_emergency_exit.py
      - name: Run deterministic safety tests
        env:
          PYTHONPATH: research
        run: python -m unittest -v test_paper_emergency_exit
