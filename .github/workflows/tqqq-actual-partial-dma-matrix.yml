name: Actual TQQQ partial DMA matrix
on:
  push:
    paths:
      - "research/tqqq_actual_partial_dma_matrix.py"
      - ".github/workflows/tqqq-actual-partial-dma-matrix.yml"
  workflow_dispatch:
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_actual_partial_dma_matrix.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-actual-partial-dma-matrix
          path: |
            data/research/tqqq_actual_partial_dma_matrix.csv
            data/research/tqqq_actual_partial_dma_periods.csv
