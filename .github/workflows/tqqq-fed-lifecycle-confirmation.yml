name: Fed Lifecycle x DMA Confirmation Study

on:
  push:
    paths:
      - "research/test_tqqq_fed_lifecycle_confirmation.py"
      - ".github/workflows/tqqq-fed-lifecycle-confirmation.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-fed-lifecycle-confirmation
  cancel-in-progress: false

jobs:
  lifecycle-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_fed_lifecycle_confirmation.py
      - name: Run lifecycle confirmation study
        run: python research/test_tqqq_fed_lifecycle_confirmation.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-fed-lifecycle-confirmation
          path: |
            data/research/tqqq_fed_lifecycle_confirmation_daily_states.csv
            data/research/tqqq_fed_lifecycle_confirmation_events.csv
            data/research/tqqq_fed_lifecycle_confirmation_summary.csv
