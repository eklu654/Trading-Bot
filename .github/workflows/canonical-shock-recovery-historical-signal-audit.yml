name: Canonical Shock Recovery — Historical Signal-Only Stress Audit

on:
  push:
    paths:
      - "research/canonical_shock_recovery_historical_signal_audit.py"
      - "research/test_tqqq_fed_paused_dma_sticky.py"
      - ".github/workflows/canonical-shock-recovery-historical-signal-audit.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: canonical-shock-recovery-historical-signal-audit
  cancel-in-progress: false

jobs:
  historical-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile scripts
        run: python -m py_compile research/canonical_shock_recovery_historical_signal_audit.py research/test_tqqq_fed_paused_dma_sticky.py
      - name: Run signal-only historical audit
        run: python research/canonical_shock_recovery_historical_signal_audit.py
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canonical-shock-recovery-historical-signal-audit
          if-no-files-found: error
          path: |
            data/research/canonical_historical_signal_spx_inputs.csv
            data/research/canonical_historical_signal_qqq_fed_states.csv
            data/research/canonical_historical_signal_drawdown_episodes.csv
            data/research/canonical_historical_signal_shock_events.csv
            data/research/canonical_historical_signal_qqq_daily.csv
            data/research/canonical_historical_signal_qqq_overlay_transitions.csv
            data/research/canonical_historical_signal_window_summary.csv
            data/research/canonical_historical_signal_manifest.json
