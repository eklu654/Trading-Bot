name: TQQQ actual three-layer validation
on:
  push:
    branches: [main]
    paths:
      - "research/tqqq_actual_three_layer_validation.py"
      - "research/causal_execution.py"
      - "research/tqqq_three_layer_event_attribution.py"
      - "requirements-dev.txt"
      - "research/requirements.txt"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_actual_three_layer_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-actual-three-layer-validation
          path: data/research/tqqq_actual_three_layer_validation.csv
