name: Delayed escalation recovery
on:
  push:
    paths:
      - "research/delayed_escalation_recovery.py"
      - ".github/workflows/delayed-escalation-recovery.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/delayed_escalation_recovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: delayed-escalation-recovery
          path: data/research/delayed_escalation_recovery.csv
