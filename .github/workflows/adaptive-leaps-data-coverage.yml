name: Adaptive LEAPS Data Coverage Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/adaptive-leaps-data-coverage.yml"
      - "research/audit_adaptive_leaps_coverage.py"
      - "research/audit_adaptive_leaps_contract_integrity.py"
      - "research/audit_adaptive_leaps_candidate_selection.py"
      - "research/adaptive_leaps_lifecycle.py"
      - "tests/test_adaptive_leaps_lifecycle.py"
      - "research/requirements.txt"

permissions:
  contents: read

concurrency:
  group: adaptive-leaps-data-coverage
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt

      - name: Compile audits
        run: |
          python -m py_compile research/audit_adaptive_leaps_coverage.py
          python -m py_compile research/audit_adaptive_leaps_contract_integrity.py
          python -m py_compile research/audit_adaptive_leaps_candidate_selection.py
          python -m py_compile research/adaptive_leaps_lifecycle.py
          python -m unittest discover -s tests -p "test_adaptive_leaps_lifecycle.py" -v

      - name: Download SPY EOD chains (2008-2025)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/options/spy
          for year in $(seq 2008 2025); do
            curl -fsSL --retry 3 --retry-delay 2 \
              -o "data/options/spy/options_${year}.parquet" \
              "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/spy/options_${year}.parquet"
          done
          curl -fsSL --retry 3 --retry-delay 2 \
            -o data/options/spy/underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/spy/underlying_prices.parquet"

      - name: Download QQQ EOD chains (2011-2025)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/options/qqq
          for year in $(seq 2011 2025); do
            curl -fsSL --retry 3 --retry-delay 2 \
              -o "data/options/qqq/options_${year}.parquet" \
              "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/qqq/options_${year}.parquet"
          done
          curl -fsSL --retry 3 --retry-delay 2 \
            -o data/options/qqq/underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/qqq/underlying_prices.parquet"

      - name: Record immutable source revision and file hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/adaptive_leaps_integrity
          {
            echo "source_repository=https://github.com/anahatsingh-ui/options-dataset-hist"
            echo "source_commit=37f6c456fe1a4775c875673fb8ef907d5cd2fd66"
            sha256sum data/options/spy/*.parquet data/options/qqq/*.parquet
          } > artifacts/adaptive_leaps_integrity/source_sha256.txt

      - name: Profile symbol, DTE, delta and quote quality
        run: |
          python research/audit_adaptive_leaps_coverage.py \
            --spy-source "data/options/spy/options_*.parquet" \
            --qqq-source "data/options/qqq/options_*.parquet" \
            --out-dir artifacts/adaptive_leaps_coverage

      - name: Audit candidate contract identity and underlying joins
        run: |
          python research/audit_adaptive_leaps_contract_integrity.py \
            --spy-source "data/options/spy/options_*.parquet" \
            --qqq-source "data/options/qqq/options_*.parquet" \
            --spy-underlying "data/options/spy/underlying_prices.parquet" \
            --qqq-underlying "data/options/qqq/underlying_prices.parquet" \
            --out-dir artifacts/adaptive_leaps_integrity

      - name: Audit frozen DTE/delta candidate availability
        run: |
          python research/audit_adaptive_leaps_candidate_selection.py \
            --spy-source "data/options/spy/options_*.parquet" \
            --qqq-source "data/options/qqq/options_*.parquet" \
            --spy-underlying "data/options/spy/underlying_prices.parquet" \
            --qqq-underlying "data/options/qqq/underlying_prices.parquet" \
            --out-dir artifacts/adaptive_leaps_candidates

      - name: Upload coverage, integrity, and candidate reports
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-leaps-data-coverage
          path: |
            artifacts/adaptive_leaps_coverage/
            artifacts/adaptive_leaps_integrity/
            artifacts/adaptive_leaps_candidates/
          if-no-files-found: error
