name: Persistent bear SQQQ
on:
  push:
    paths:
      - "research/persistent_bear_sqqq.py"
      - ".github/workflows/persistent-bear-sqqq.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/persistent_bear_sqqq.py
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-bear-sqqq
          path: data/research/persistent_bear_sqqq.csv
