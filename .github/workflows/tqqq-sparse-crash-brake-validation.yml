name: TQQQ sparse crash brake validation
on:
  push:
    paths:
      - "research/tqqq_sparse_crash_brake_validation.py"
      - "research/causal_execution.py"
      - ".github/workflows/tqqq-sparse-crash-brake-validation.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_sparse_crash_brake_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-sparse-crash-brake-validation
          path: data/research/tqqq_sparse_crash_brake_validation.csv
      - name: Publish result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/tqqq_sparse_crash_brake_validation.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: publish sparse crash brake validation"
            git push
          fi
