name: Synthetic 3x QQQ dotcom crash brake
on:
  push:
    paths:
      - "research/synthetic_3x_qqq_dotcom_crash_brake.py"
      - ".github/workflows/synthetic-3x-qqq-dotcom.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/synthetic_3x_qqq_dotcom_crash_brake.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-3x-qqq-dotcom
          path: data/research/synthetic_3x_qqq_dotcom_crash_brake.csv
      - name: Publish result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+eklu654@users.noreply.github.com"
          git add data/research/synthetic_3x_qqq_dotcom_crash_brake.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: publish synthetic dotcom crash brake"
            git push
          fi
