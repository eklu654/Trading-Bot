name: research-tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Keep only the newest validation run for a given branch/PR. Rapid research
# commits otherwise waste runners on superseded revisions.
concurrency:
  group: research-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q
