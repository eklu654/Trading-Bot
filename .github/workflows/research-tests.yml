name: research-tests

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "research/**/*.py"
      - "tests/**"
      - "data/**"
      - "requirements*.txt"
      - "pytest.ini"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "research/**/*.py"
      - "tests/**"
      - "data/**"
      - "requirements*.txt"
      - "pytest.ini"

# Keep only the newest validation run for a given branch/PR. Rapid research
# commits otherwise waste runners on superseded revisions.
concurrency:
  group: research-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt -r research/requirements.txt
      - name: Test read-only daily market and portfolio report
        env:
          PYTHONPATH: research
        run: python -m unittest -v test_daily_market_portfolio_report
      - name: Validate daily email workflow YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/daily-market-portfolio-email-recovery.yml", aliases: true); puts "Daily report recovery workflow YAML parsed successfully."'
      - run: PYTHONPATH=. pytest -q
