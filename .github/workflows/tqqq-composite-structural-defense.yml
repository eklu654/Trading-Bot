name: Composite Fed Macro DMA Structural Defense

on:
  push:
    paths:
      - "research/test_tqqq_composite_structural_defense.py"
      - "research/test_tqqq_fed_paused_dma_sticky.py"
      - "research/test_tqqq_macro_regime.py"
      - ".github/workflows/tqqq-composite-structural-defense.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-composite-structural-defense
  cancel-in-progress: false

jobs:
  composite-structural-defense:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_composite_structural_defense.py
      - name: Run composite structural defense study
        run: PYTHONPATH=research python research/test_tqqq_composite_structural_defense.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-composite-structural-defense
          path: |
            data/research/tqqq_composite_structural_defense_summary.csv
            data/research/tqqq_composite_structural_defense_paths.csv
            data/research/tqqq_composite_structural_defense_transitions.csv
            data/research/tqqq_composite_structural_defense_daily_states.csv
