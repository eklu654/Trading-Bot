name: Alpaca Paper Credential Check

on:
  workflow_dispatch:
  schedule:
    # Weekdays shortly after the US market opens; this checks connectivity only.
    - cron: "35 14 * * 1-5"

permissions:
  contents: read

concurrency:
  group: alpaca-paper-credential-check
  cancel-in-progress: false

jobs:
  verify-paper-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        portfolio: [b0, f75]
    steps:
      - name: Verify paper API credentials and account identity
        shell: bash
        env:
          PORTFOLIO: ${{ matrix.portfolio }}
          APCA_API_KEY_ID_B0: ${{ secrets.ALPACA_PAPER_API_KEY_B0 }}
          APCA_API_SECRET_KEY_B0: ${{ secrets.ALPACA_PAPER_API_SECRET_B0 }}
          APCA_API_KEY_ID_F75: ${{ secrets.ALPACA_PAPER_API_KEY_F75 }}
          APCA_API_SECRET_KEY_F75: ${{ secrets.ALPACA_PAPER_API_SECRET_F75 }}
        run: |
          set -euo pipefail
          if [[ "$PORTFOLIO" == "b0" ]]; then
            key="${APCA_API_KEY_ID_B0:-}"
            secret="${APCA_API_SECRET_KEY_B0:-}"
          else
            key="${APCA_API_KEY_ID_F75:-}"
            secret="${APCA_API_SECRET_KEY_F75:-}"
          fi
          if [[ -z "$key" || -z "$secret" ]]; then
            echo "::error::Required GitHub Actions secret is missing or empty for $PORTFOLIO."
            exit 1
          fi
          response="$(curl --silent --show-error --fail-with-body --max-time 20 \
            -H "APCA-API-KEY-ID: $key" \
            -H "APCA-API-SECRET-KEY: $secret" \
            https://paper-api.alpaca.markets/v2/account)"
          # Print only non-secret account metadata; never print credentials or raw response.
          python -c 'import json,sys; a=json.load(sys.stdin); print("portfolio="+sys.argv[1]); print("status="+str(a.get("status","unknown"))); print("account_number_present="+str(bool(a.get("account_number"))).lower()); print("trading_blocked="+str(a.get("trading_blocked","unknown")).lower()); print("account_blocked="+str(a.get("account_blocked","unknown")).lower()); print("currency="+str(a.get("currency","unknown")))' "$PORTFOLIO" <<< "$response"
          unset key secret response
