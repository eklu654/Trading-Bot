name: ETF Bear Event Archetypes

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_etf026_bear_event_archetypes.py"
      - "research/build_historical_regime_dataset.py"
      - ".github/workflows/etf-bear-event-archetypes.yml"

concurrency:
  group: etf-bear-event-archetypes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archetypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research/requirements.txt
      - name: Build historical dataset
        run: python research/build_historical_regime_dataset.py
      - name: Run ETF-026 event archetype diagnostics
        run: python research/backtest_etf026_bear_event_archetypes.py
      - name: Upload ETF-026 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: etf026-bear-event-archetypes
          path: data/research/etf026_*.csv
