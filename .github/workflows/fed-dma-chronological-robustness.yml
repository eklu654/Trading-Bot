name: Frozen Fed-DMA Chronological Robustness

on:
  push:
    paths:
      - "research/fed_dma_chronological_robustness.py"
      - "research/canonical_shock_recovery_active_tightening_overlay.py"
      - "research/canonical_shock_recovery_fed_dma_overlay.py"
      - "research/canonical_shock_recovery_fed_dma_overlay.py"
      - "research/causal_execution.py"
      - "research/requirements.txt"
      - ".github/workflows/fed-dma-chronological-robustness.yml"
      - "docs/research/FED_DMA_OVERLAY_CHRONOLOGICAL_ROBUSTNESS_PREREGISTRATION_2026-10-11.md"
  workflow_dispatch:

concurrency:
  group: fed-dma-chronological-robustness
  cancel-in-progress: false

jobs:
  frozen-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile frozen replay and dependencies
        run: python -m py_compile research/fed_dma_chronological_robustness.py research/canonical_shock_recovery_active_tightening_overlay.py research/canonical_shock_recovery_fed_dma_overlay.py research/causal_execution.py
      - name: Run preregistered chronological robustness test
        run: python research/fed_dma_chronological_robustness.py
      - name: Upload reproducibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fed-dma-chronological-robustness
          if-no-files-found: error
          path: |
            data/research/fed_dma_chronological_robustness_frozen_inputs.csv
            data/research/fed_dma_chronological_robustness_summary.csv
            data/research/fed_dma_chronological_robustness_windows.csv
            data/research/fed_dma_chronological_robustness_comparison.csv
            data/research/fed_dma_chronological_robustness_gates.csv
            data/research/fed_dma_chronological_robustness_ex_2022_2024.csv
            data/research/fed_dma_chronological_robustness_daily.csv
            data/research/fed_dma_chronological_robustness_transitions.csv
            data/research/fed_dma_chronological_robustness_manifest.json
