name: ETF-024 Walk-Forward Cost Stress

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_etf024_walk_forward_cost_stress.py"
      - ".github/workflows/etf024-walk-forward-cost-stress.yml"

concurrency:
  group: etf024-cost-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  cost-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research/requirements.txt
      - name: Build focused dataset
        run: python research/build_etf020_dataset.py
      - name: Run ETF-024 cost stress
        working-directory: research
        env:
          PYTHONPATH: .
        run: python backtest_etf024_walk_forward_cost_stress.py
