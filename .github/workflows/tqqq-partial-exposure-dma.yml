name: TQQQ Partial Exposure DMA Research

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "research/test_tqqq_partial_exposure_dma.py"
      - "tests/test_tqqq_partial_exposure_dma.py"
      - ".github/workflows/tqqq-partial-exposure-dma.yml"

permissions:
  contents: read

concurrency:
  group: tqqq-partial-exposure-dma
  cancel-in-progress: true

jobs:
  partial-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/requirements.txt -r requirements-dev.txt
      - name: Build canonical historical dataset from frozen ETF-031 builder
        run: |
          git show 645f332bb95ad39de046378ec6262122f4c7d7cc:research/build_historical_regime_dataset.py > research/_frozen_etf031_dataset_builder.py
          python research/_frozen_etf031_dataset_builder.py --symbols TQQQ
          rm research/_frozen_etf031_dataset_builder.py
      - name: Run systematic partial-exposure matrix
        run: python research/test_tqqq_partial_exposure_dma.py
      - name: Validate exact-period artifact
        run: |
          python - <<'PY'
          import pandas as pd
          p = "data/research/tqqq_partial_exposure_dma_full_matrix.csv"
          df = pd.read_csv(p)
          partial = df[df["strategy"].str.contains("partial")]
          expected_partial = 8 * 84 * 35
          if len(partial) != expected_partial:
              raise SystemExit(f"Expected {expected_partial} partial rows, found {len(partial)}")
          if len(df) != expected_partial + 9:
              raise SystemExit(f"Expected {expected_partial + 9} total rows, found {len(df)}")
          if set(df["observations"].astype(int)) != {4167}:
              raise SystemExit("Not every result uses exactly 4,167 observations.")
          if set(df["start"].str[:10]) != {"2010-03-11"} or set(df["end"].str[:10]) != {"2026-10-02"}:
              raise SystemExit("Period endpoints are not frozen to 2010-03-11 -> 2026-10-02.")
          controls = df[df["strategy"].str.contains("buy-and-hold|binary", regex=True)]
          if len(controls) != 9:
              raise SystemExit("Missing expected direct controls.")
          # Validate the implementation independently against the ETF-031
          # return functions on this exact downloaded snapshot. The historical
          # ETF-031 artifact is retained as a reference, but Yahoo can revise
          # historical adjusted prices between runs, so a snapshot drift must
          # be recorded rather than silently mixing two datasets.
          from research.backtest_etf031_tqqq_robustness import (
              load_frame,
              buy_hold_returns,
              dma_next_open_returns,
          )
          frame = load_frame("TQQQ").loc[pd.Timestamp("2010-03-11"):pd.Timestamp("2026-10-02")]
          independent_bh = 5000.0 * (1.0 + buy_hold_returns(frame["adj_close"], 0)).prod()
          independent_dma200 = 5000.0 * (1.0 + dma_next_open_returns(frame, 0)).prod()
          bh = float(controls.loc[controls["strategy"] == "TQQQ buy-and-hold", "final_balance"].iloc[0])
          dma200 = float(controls.loc[controls["strategy"] == "TQQQ 200-DMA binary", "final_balance"].iloc[0])
          if abs(bh - independent_bh) > 0.01:
              raise SystemExit(f"Buy-and-hold implementation mismatch: {bh} vs {independent_bh}")
          if abs(dma200 - independent_dma200) > 0.01:
              raise SystemExit(f"200-DMA implementation mismatch: {dma200} vs {independent_dma200}")

          frozen_bh = 1558429.0110026195
          frozen_dma200 = 504212.4901155498
          reconciliation = pd.DataFrame([
              {"metric": "TQQQ_buy_and_hold_final_balance", "historical_frozen": frozen_bh, "current_snapshot": bh, "absolute_difference": bh - frozen_bh},
              {"metric": "TQQQ_200DMA_next_open_final_balance", "historical_frozen": frozen_dma200, "current_snapshot": dma200, "absolute_difference": dma200 - frozen_dma200},
          ])
          reconciliation.to_csv("data/research/tqqq_partial_exposure_data_reconciliation.csv", index=False)

          import hashlib
          raw = open("data/research/tqqq_daily.csv", "rb").read()
          with open("data/research/tqqq_daily.sha256", "w") as fh:
              fh.write(hashlib.sha256(raw).hexdigest() + "  tqqq_daily.csv\n")

          print("Current-snapshot controls independently verified against ETF-031 formulas.")
          print("Historical ETF-031 control drift is recorded in tqqq_partial_exposure_data_reconciliation.csv.")
          print("Rows:", len(df))
          print("Top 20 partial candidates by final balance:")
          print(partial.sort_values("final_balance", ascending=False).head(20).to_string(index=False))
          print("\nControls:")
          print(controls[["strategy","final_balance","cagr","max_drawdown"]].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-partial-exposure-dma
          path: |
            data/research/tqqq_partial_exposure_dma_full_matrix.csv
            data/research/tqqq_partial_exposure_dma_controls.csv
            data/research/tqqq_partial_exposure_top_wealth.csv
            data/research/tqqq_partial_exposure_top_drawdown.csv
            data/research/tqqq_partial_exposure_top_balanced.csv
            data/research/tqqq_partial_exposure_dma_summary.csv
            data/research/tqqq_partial_exposure_data_reconciliation.csv
            data/research/tqqq_daily.csv
            data/research/tqqq_daily.sha256
          if-no-files-found: error
