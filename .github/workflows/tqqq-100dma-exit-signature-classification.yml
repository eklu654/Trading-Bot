name: TQQQ 100-DMA Exit Signature Classification

on:
  push:
    paths:
      - "research/analyze_tqqq_100dma_exit_signatures.py"
      - "research/analyze_tqqq_100dma_exit_signature_classifier.py"
      - ".github/workflows/tqqq-100dma-exit-signature-classification.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-100dma-exit-signature-classification
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/analyze_tqqq_100dma_exit_signatures.py research/analyze_tqqq_100dma_exit_signature_classifier.py
      - run: python research/analyze_tqqq_100dma_exit_signatures.py
      - run: python research/analyze_tqqq_100dma_exit_signature_classifier.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-100dma-exit-signature-classification
          path: |
            data/research/tqqq_100dma_exit_signature_cv_summary.csv
            data/research/tqqq_100dma_exit_signature_cv_folds.csv
