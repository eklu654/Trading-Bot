name: ETF-019 Signal Lead Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_etf019_signal_lead_diagnostics.py"
      - "research/build_etf018_dataset.py"
      - ".github/workflows/etf019-signal-lead-diagnostics.yml"

concurrency:
  group: etf019-signal-lead-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research/requirements.txt
      - run: python research/build_etf018_dataset.py
      - run: python research/backtest_etf019_signal_lead_diagnostics.py
