name: TQQQ 100-DMA Macro Classification

on:
  push:
    paths:
      - "research/analyze_tqqq_100dma_macro_context.py"
      - "research/analyze_tqqq_100dma_macro_classification.py"
      - ".github/workflows/tqqq-100dma-macro-classification.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-100dma-macro-classification
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: |
          python -m py_compile research/analyze_tqqq_100dma_macro_context.py
          python -m py_compile research/analyze_tqqq_100dma_macro_classification.py
      - name: Build macro episode attribution
        run: python research/analyze_tqqq_100dma_macro_context.py
      - name: Classify macro context
        run: python research/analyze_tqqq_100dma_macro_classification.py
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-100dma-macro-classification
          path: |
            data/research/tqqq_100dma_macro_episode_attribution.csv
            data/research/tqqq_100dma_macro_episode_duration_summary.csv
            data/research/tqqq_100dma_macro_policy_state_summary.csv
            data/research/tqqq_100dma_macro_feature_correlations.csv
            data/research/tqqq_100dma_macro_major_loss_episodes.csv
