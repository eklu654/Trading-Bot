name: TQQQ Partial Exposure Re-entry Sensitivity
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - research/test_tqqq_partial_exposure_reentry_sensitivity.py
      - .github/workflows/tqqq-partial-exposure-reentry-sensitivity.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check completion marker
        id: completion
        run: |
          set -euo pipefail
          mkdir -p .research-state
          fingerprint="$(sha256sum research/test_tqqq_partial_exposure_reentry_sensitivity.py .github/workflows/tqqq-partial-exposure-reentry-sensitivity.yml | sha256sum | cut -d" " -f1)"
          if [ -f .research-state/tqqq-partial-reentry.fingerprint ] && [ "$(cat .research-state/tqqq-partial-reentry.fingerprint)" = "$fingerprint" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.completion.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.completion.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/requirements.txt -r requirements-dev.txt
      - name: Build canonical TQQQ snapshot
        if: steps.completion.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git show 645f332bb95ad39de046378ec6262122f4c7d7cc:research/build_historical_regime_dataset.py > research/_frozen_etf031_dataset_builder.py
          trap 'rm -f research/_frozen_etf031_dataset_builder.py' EXIT
          python research/_frozen_etf031_dataset_builder.py --symbols TQQQ
      - name: Validate snapshot
        if: steps.completion.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv("data/research/tqqq_daily.csv",parse_dates=["Date"])
          r=x.loc[(x.Date>=pd.Timestamp("2010-03-11"))&(x.Date<=pd.Timestamp("2026-10-02"))]
          assert len(r)==4167, len(r)
          assert r.Date.min()==pd.Timestamp("2010-03-11")
          assert r.Date.max()==pd.Timestamp("2026-10-02")
          PY
      - name: Run research
        if: steps.completion.outputs.skip != 'true'
        run: python research/test_tqqq_partial_exposure_reentry_sensitivity.py
      - name: Validate outputs
        if: steps.completion.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv("data/research/tqqq_partial_exposure_reentry_sensitivity.csv")
          assert len(x)==200, len(x)
          assert x.final_balance.notna().all()
          assert x.max_drawdown.notna().all()
          print(x.sort_values("final_balance",ascending=False).head(20).to_string(index=False))
          PY
      - name: Upload results
        if: success() && steps.completion.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-partial-exposure-reentry-sensitivity
          path: |
            data/research/tqqq_daily.csv
            data/research/tqqq_partial_exposure_reentry_sensitivity.csv
            data/research/tqqq_partial_exposure_reentry_control.csv
          if-no-files-found: error
          retention-days: 30
      - name: Record completion
        if: success() && steps.completion.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p .research-state
          fingerprint="$(sha256sum research/test_tqqq_partial_exposure_reentry_sensitivity.py .github/workflows/tqqq-partial-exposure-reentry-sensitivity.yml | sha256sum | cut -d" " -f1)"
          printf '%s\n' "$fingerprint" > .research-state/tqqq-partial-reentry.fingerprint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .research-state/tqqq-partial-reentry.fingerprint
          git diff --cached --quiet || git commit -m "ci: mark partial exposure re-entry research complete"
          git push
