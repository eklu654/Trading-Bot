name: OPTIONS-002 Wider-Wing Research

on:
  workflow_dispatch:

jobs:
  wider-iron-condors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt

      - name: Compile research scripts
        run: python -m py_compile research/*.py

      - name: Build historical dataset
        run: python research/build_historical_regime_dataset.py

      - name: Download SPY historical option chains
        run: |
          mkdir -p data/options/spy
          for year in $(seq 2010 2025); do
            curl -L --fail --retry 3 --retry-delay 2 -o "data/options/spy/options_${year}.parquet" "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/options_${year}.parquet"
          done

      - name: Replay fixed-width methodology candidates
        run: |
          for spec in "delta20_w5 0.20 5" "delta20_w10 0.20 10"; do
            set -- $spec
            label="$1"
            delta="$2"
            wing="$3"
            for candidate in ALL_DAYS BROAD_SIDEWAYS TURBULENT_ONLY; do
              for fill in conservative mid; do
                python research/replay_options002.py --options-source "data/options/spy/options_*.parquet" --candidate "$candidate" --fill-model "$fill" --target-delta "$delta" --wing-width "$wing" --strategy-label "$label"
              done
            done
          done

      - name: Replay dynamic 20/10-delta iron condors
        run: |
          for candidate in ALL_DAYS BROAD_SIDEWAYS TURBULENT_ONLY; do
            for fill in conservative mid; do
              python research/replay_options002.py --options-source "data/options/spy/options_*.parquet" --candidate "$candidate" --fill-model "$fill" --target-delta 0.20 --long-delta 0.10 --strategy-label "delta20_long10d"
            done
          done

      - name: Analyze wider candidates by chronology and entry regime
        run: python research/analyze_options002_regime_results.py

      - name: Replay account feasibility for wider candidates
        run: |
          for nlv in 5000 10000; do
            for label in delta20_w5 delta20_w10 delta20_long10d; do
              for candidate in all_days broad_sideways turbulent_only; do
                for fill in conservative mid; do
                  stem="options002_${label}_${candidate}_${fill}"
                  for risk in 0.03 0.05 0.07; do
                    python research/account_feasibility_options002.py --input "data/research/${stem}_candidates.csv" --outcomes "data/research/${stem}_candidate_outcomes.csv" --marks "data/research/${stem}_candidate_marks.csv" --starting-nlv "${nlv}" --max-bpr-pct 0.50 --max-risk-pct "${risk}" --output "data/research/${stem}_account_${nlv}_risk_${risk}.csv"
                  done
                done
              done
            done
          done

      - name: Consolidate wider-candidate capital ladder
        run: python research/analyze_options002_capital_ladder.py

      - name: Analyze OPTIONS-002 capital feasibility on holdout
        run: python research/analyze_options002_capital_holdout.py

      - name: Compare $5,000 capital-equivalent holdout
        run: python research/compare_options002_etf001_capital_equivalent.py

      - name: Print wider-candidate summaries
        run: |
          for f in data/research/options002_delta20_*_account_*_risk_*_summary.csv; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done

      - name: Upload wider-candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: options002-wider-candidate-results
          path: data/research/
          if-no-files-found: error
