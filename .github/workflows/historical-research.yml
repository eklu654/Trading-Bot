name: Historical Research
# Research pipeline trigger: run against current main implementation.

on:
  workflow_dispatch:
  push:
    paths:
      - "research/**"
      - ".github/workflows/historical-research.yml"

jobs:
  historical-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt

      - name: Compile research scripts
        run: python -m py_compile research/*.py

      - name: Build historical dataset
        run: python research/build_historical_regime_dataset.py

      - name: Run ETF-001 backtest
        run: python research/backtest_etf001.py

      - name: Run ETF-001 trend and hysteresis matrix\n        run: python research/backtest_etf001_matrix.py\n\n      - name: Analyze OPTIONS-001 opportunity windows
        run: python research/analyze_options_opportunity_windows.py

      - name: Evaluate regime candidates
        run: python research/evaluate_regime_candidates.py

      - name: Download SPY historical option chains
        run: |
          mkdir -p data/options/spy
          for year in $(seq 2010 2025); do
            curl -L --fail --retry 3 --retry-delay 2               -o "data/options/spy/options_${year}.parquet"               "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/spy/options_${year}.parquet"
          done
          ls -lh data/options/spy

      - name: Audit 0DTE dataset availability
        run: python research/audit_0dte_dataset.py --options-source "data/options/spy/options_*.parquet"

      - name: Replay OPTIONS-001 all-market baseline plus no-stop benchmark
        run: |
          for fill in conservative mid; do
            python research/replay_options001.py --options-source "data/options/spy/options_*.parquet" --candidate ALL_DAYS --fill-model "${fill}"
            python research/replay_options001.py --options-source "data/options/spy/options_*.parquet" --candidate ALL_DAYS --fill-model "${fill}" --loss-credit-multiple 0
          done

      - name: Replay OPTIONS-001 broad-sideways baseline plus no-stop benchmark
        run: |
          for fill in conservative mid; do
            python research/replay_options001.py --options-source "data/options/spy/options_*.parquet" --candidate BROAD_SIDEWAYS --fill-model "${fill}"
            python research/replay_options001.py --options-source "data/options/spy/options_*.parquet" --candidate BROAD_SIDEWAYS --fill-model "${fill}" --loss-credit-multiple 0
          done

      - name: Replay OPTIONS-001 turbulent-only baseline plus no-stop benchmark
        run: |
          for fill in conservative mid; do
            python research/replay_options001.py --options-source "data/options/spy/options_*.parquet" --candidate TURBULENT_ONLY --fill-model "${fill}"
            python research/replay_options001.py --options-source "data/options/spy/options_*.parquet" --candidate TURBULENT_ONLY --fill-model "${fill}" --loss-credit-multiple 0
          done

      - name: Replay OPTIONS-001 account feasibility sensitivity — broad sideways
        run: |
          for nlv in 2000 5000 10000; do
            for fill in conservative mid; do
              for loss_tag in loss2x nostop; do
                stem="options001_replay_broad_sideways_${fill}_${loss_tag}"
                python research/account_feasibility_replay.py \
                  --input "data/research/${stem}_candidates.csv" \
                  --outcomes "data/research/${stem}_candidate_outcomes.csv" \
                  --marks "data/research/${stem}_candidate_marks.csv" \
                  --starting-nlv "${nlv}" \
                  --max-bpr-pct 0.50 \
                  --output "data/research/${stem}_account_${nlv}.csv"
              done
            done
          done

      - name: Replay OPTIONS-001 account feasibility sensitivity — turbulent only
        run: |
          for nlv in 2000 5000 10000; do
            for fill in conservative mid; do
              for loss_tag in loss2x nostop; do
                stem="options001_replay_turbulent_only_${fill}_${loss_tag}"
                python research/account_feasibility_replay.py \
                  --input "data/research/${stem}_candidates.csv" \
                  --outcomes "data/research/${stem}_candidate_outcomes.csv" \
                  --marks "data/research/${stem}_candidate_marks.csv" \
                  --starting-nlv "${nlv}" \
                  --max-bpr-pct 0.50 \
                  --output "data/research/${stem}_account_${nlv}.csv"
              done
            done
          done

      - name: Replay OPTIONS-002 defined-risk iron condor — $5,000 baseline
        run: |
          for candidate in ALL_DAYS BROAD_SIDEWAYS TURBULENT_ONLY; do
            for fill in conservative mid; do
              python research/replay_options002.py --options-source "data/options/spy/options_*.parquet" --candidate "$candidate" --fill-model "$fill" --wing-width 2
            done
          done

      - name: Replay OPTIONS-002 account feasibility — $5,000 risk sensitivity
        run: |
          for candidate in ALL_DAYS BROAD_SIDEWAYS TURBULENT_ONLY; do
            lower_candidate=$(echo "$candidate" | tr "[:upper:]" "[:lower:]")
            for fill in conservative mid; do
              stem="options002_delta16_w2_${lower_candidate}_${fill}"
              for risk in 0.03 0.05 0.07; do
                python research/account_feasibility_options002.py \
                  --input "data/research/${stem}_candidates.csv" \
                  --outcomes "data/research/${stem}_candidate_outcomes.csv" \
                  --marks "data/research/${stem}_candidate_marks.csv" \
                  --starting-nlv 5000 --max-bpr-pct 0.50 --max-risk-pct "$risk" \
                  --output "data/research/${stem}_account_5000_risk_${risk}.csv"
              done
            done
          done
      - name: Replay OPTIONS-001 defense variants — broad sideways
        run: |
          echo "=== NO ADJUSTMENT DEFENSE CONTROL ==="
          python research/replay_options001_defense.py --options-source "data/options/spy/options_*.parquet" --candidate BROAD_SIDEWAYS --fill-model conservative --defense none
          python research/replay_options001_defense.py --options-source "data/options/spy/options_*.parquet" --candidate BROAD_SIDEWAYS --fill-model mid --defense none
          echo "=== ROLL UNTESTED ==="
          python research/replay_options001_defense.py --options-source "data/options/spy/options_*.parquet" --candidate BROAD_SIDEWAYS --fill-model conservative --defense roll-untested
          python research/replay_options001_defense.py --options-source "data/options/spy/options_*.parquet" --candidate BROAD_SIDEWAYS --fill-model mid --defense roll-untested

      - name: Print research summaries
        run: |
          echo "=== ETF OVERALL ==="
          cat data/research/etf001_overall_summary.csv
          echo "=== ETF BY REGIME (DMA) ==="
          cat data/research/etf001_dma_regime_summary.csv
          echo "=== ETF BY REGIME (DMA + VIX) ==="
          cat data/research/etf001_dma_vix_regime_summary.csv
          echo "=== OPTIONS WINDOWS ==="
          cat data/research/options_opportunity_summary.csv
          echo "=== REGIME FREQUENCY ==="
          cat data/research/regime_frequency_summary.csv
          echo "=== OPTIONS CANDIDATE OPPORTUNITY ==="
          cat data/research/options_opportunity_candidate_summary.csv
          echo "=== REGIME CANDIDATE RESULTS ==="
          cat data/research/regime_candidate_etf_results.csv
          echo "=== REGIME CANDIDATE FREQUENCY ==="
          cat data/research/regime_candidate_frequency.csv
          echo "=== ACCOUNT FEASIBILITY SENSITIVITY ==="
          for f in data/research/*_account_2000_summary.csv data/research/*_account_5000_summary.csv data/research/*_account_10000_summary.csv; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done
          echo "=== 0DTE DATASET AUDIT ==="
          cat data/research/options001_0dte_dataset_audit.csv
          echo "=== OPTIONS-002 ACCOUNT FEASIBILITY ==="
          for f in data/research/options002_*_account_5000_risk_*_summary.csv; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }
          done
          echo "=== DEFENSE CONTROL CONSERVATIVE ==="
          cat data/research/options001_defense_summary_broad_sideways_conservative_none.csv
          echo "=== DEFENSE CONTROL MID ==="
          cat data/research/options001_defense_summary_broad_sideways_mid_none.csv
          echo "=== ROLL UNTESTED CONSERVATIVE ==="
          cat data/research/options001_defense_summary_broad_sideways_conservative_roll_untested.csv
          echo "=== ROLL UNTESTED MID ==="
          cat data/research/options001_defense_summary_broad_sideways_mid_roll_untested.csv

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: historical-research-results
          path: data/research/
          if-no-files-found: error
