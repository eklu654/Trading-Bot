name: TQQQ swing first matrix causal
on:
  push:
    paths:
      - "research/tqqq_swing_first_matrix_causal.py"
      - "research/causal_execution.py"
      - "research/tqqq_swing_dynamic_exit_matrix.py"
      - ".github/workflows/tqqq-swing-first-matrix-causal.yml"
  workflow_dispatch:
jobs:
  swing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_swing_first_matrix_causal.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-swing-first-matrix-causal
          path: data/research/tqqq_swing_first_matrix.csv
