name: TQQQ swing first matrix causal
on:
  push:
    paths:
      - "research/tqqq_swing_first_matrix_causal.py"
      - "research/causal_execution.py"
      - "research/tqqq_swing_dynamic_exit_matrix.py"
      - "research/tqqq_short_horizon_surface.py"
      - "research/tqqq_short_breakout_validation.py"
      - ".github/workflows/tqqq-swing-first-matrix-causal.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  swing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/tqqq_swing_first_matrix_causal.py
      - run: PYTHONPATH=research python research/tqqq_swing_dynamic_exit_matrix.py
      - run: PYTHONPATH=research python research/tqqq_short_horizon_surface.py
      - run: PYTHONPATH=research python research/tqqq_short_breakout_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-swing-first-matrix-causal
          path: |
            data/research/tqqq_swing_first_matrix.csv
            data/research/tqqq_swing_dynamic_exit_matrix.csv
            data/research/tqqq_short_horizon_surface.csv
            data/research/tqqq_short_breakout_validation.csv

      - name: Commit research result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/tqqq_swing_dynamic_exit_matrix.csv data/research/tqqq_short_horizon_surface.csv data/research/tqqq_short_breakout_validation.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: publish dynamic-exit matrix result"
            git push
          fi
