name: Adaptive LEAPS Alternate-Source Contract Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/adaptive-leaps-alternate-source-audit.yml"
      - "research/audit_adaptive_leaps_alternate_source.py"
      - "research/audit_adaptive_leaps_intrinsic_bounds.py"

permissions:
  contents: read

concurrency:
  group: adaptive-leaps-alternate-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Install research dependencies
        run: python -m pip install -r research/requirements.txt

      - name: Download pinned preserved SPY/QQQ option chains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/options/alternate artifacts/adaptive_leaps_alternate_source
          curl -fL --retry 3 --retry-delay 2 \
            -o data/options/alternate/SPY_options.parquet \
            "https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/SPY_options.parquet"
          curl -fL --retry 3 --retry-delay 2 \
            -o data/options/alternate/QQQ_options.parquet \
            "https://github.com/lambdaclass/options_portfolio_backtester/releases/download/data-v1/QQQ_options.parquet"
          curl -fL --retry 3 --retry-delay 2 \
            -o data/options/alternate/SPY_primary_2008.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/spy/options_2008.parquet"
          curl -fL --retry 3 --retry-delay 2 \
            -o data/options/alternate/QQQ_primary_2013.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/qqq/options_2013.parquet"
          curl -fL --retry 3 --retry-delay 2 \
            -o data/options/alternate/QQQ_primary_2014.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/qqq/options_2014.parquet"
          curl -fL --retry 3 --retry-delay 2 \
            -o data/options/alternate/SPY_underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/spy/underlying_prices.parquet"
          curl -fL --retry 3 --retry-delay 2 \
            -o data/options/alternate/QQQ_underlying_prices.parquet \
            "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/37f6c456fe1a4775c875673fb8ef907d5cd2fd66/qqq/underlying_prices.parquet"
          {
            echo "alternate_source_release=https://github.com/lambdaclass/options_portfolio_backtester/releases/tag/data-v1"
            echo "SPY_options.parquet expected_sha256=a7152991b45b81f090f970e945bf88def8093b8ecb9b250e9891cb6d88041f0a"
            echo "QQQ_options.parquet expected_sha256=1f831556cd87ec9d7af43d3b47a69a829ffb2fb199cfcef4ff55d289badf8734"
            echo "primary_source_commit=37f6c456fe1a4775c875673fb8ef907d5cd2fd66"
            echo "QQQ_primary_2013.parquet expected_sha256=1e992c9430243c46eb7b37c3298876bfe77ed0bb3af634a0d380c7cfd825de08"
            sha256sum data/options/alternate/SPY_options.parquet data/options/alternate/QQQ_options.parquet data/options/alternate/SPY_primary_2008.parquet data/options/alternate/QQQ_primary_2013.parquet data/options/alternate/QQQ_primary_2014.parquet data/options/alternate/SPY_underlying_prices.parquet data/options/alternate/QQQ_underlying_prices.parquet
          } > artifacts/adaptive_leaps_alternate_source/source_sha256.txt
          echo "a7152991b45b81f090f970e945bf88def8093b8ecb9b250e9891cb6d88041f0a  data/options/alternate/SPY_options.parquet" | sha256sum -c -
          echo "1f831556cd87ec9d7af43d3b47a69a829ffb2fb199cfcef4ff55d289badf8734  data/options/alternate/QQQ_options.parquet" | sha256sum -c -
          echo "78acbfa15264b197b4bf77dca5f8f03d218a440249259d9d6d28f1f7a1f21194  data/options/alternate/SPY_primary_2008.parquet" | sha256sum -c -
          echo "1e992c9430243c46eb7b37c3298876bfe77ed0bb3af634a0d380c7cfd825de08  data/options/alternate/QQQ_primary_2013.parquet" | sha256sum -c -
          echo "1d576b3db1d60a840e695f668bd899e794c92022a4380b755890d95a05865386  data/options/alternate/QQQ_primary_2014.parquet" | sha256sum -c -
          echo "847e60a441eb10969d87cd4a6da604257b782d9076168f68d5730b84096c79db  data/options/alternate/SPY_underlying_prices.parquet" | sha256sum -c -
          echo "78c015fd7fa9d493cd798d5ae81b3c2ae6dc3b8176e25e7bb90cd4114b103351  data/options/alternate/QQQ_underlying_prices.parquet" | sha256sum -c -

      - name: Run flagged-contract continuity cross-check
        run: |
          python -m research.audit_adaptive_leaps_alternate_source \
            --spy-source data/options/alternate/SPY_options.parquet \
            --qqq-source data/options/alternate/QQQ_options.parquet \
            --spy-primary-source data/options/alternate/SPY_primary_2008.parquet \
            --qqq-primary-source "data/options/alternate/QQQ_primary_*.parquet" \
            --out-dir artifacts/adaptive_leaps_alternate_source

      - name: Run option intrinsic-bound price-basis diagnostic
        run: |
          python -m research.audit_adaptive_leaps_intrinsic_bounds \
            --spy-source data/options/alternate/SPY_options.parquet \
            --qqq-source data/options/alternate/QQQ_options.parquet \
            --spy-underlying data/options/alternate/SPY_underlying_prices.parquet \
            --qqq-underlying data/options/alternate/QQQ_underlying_prices.parquet \
            --out-dir artifacts/adaptive_leaps_alternate_source

      - name: Upload alternate-source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-leaps-alternate-source-contract-audit
          path: artifacts/adaptive_leaps_alternate_source/
          if-no-files-found: warn
