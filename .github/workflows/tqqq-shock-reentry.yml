name: TQQQ Shock-Only Re-entry Test
on:
  push:
    paths:
      - "research/test_tqqq_shock_reentry.py"
      - ".github/workflows/tqqq-shock-reentry.yml"
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: python research/test_tqqq_shock_reentry.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-shock-reentry-results
          path: data/research/tqqq_shock_reentry_*.csv
