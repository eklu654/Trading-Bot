name: QQQ Intraday -4.5% Monitor + Paper Defense Latch

on:
  schedule:
    # Poll every five minutes during broad US market hours; broker clock gates execution.
    - cron: "1-56/5 13-21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qqq-intraday-monitor.yml"
      - "research/qqq_intraday_monitor.py"
      - "research/test_qqq_intraday_monitor.py"
      - "research/record_emergency_exit_latch.py"
      - "research/paper_virtual_portfolio.py"

permissions:
  contents: write

concurrency:
  group: paper-broker-mutations
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and compile read-only monitor
        run: |
          python -m py_compile research/qqq_intraday_monitor.py
          PYTHONPATH=research python research/test_qqq_intraday_monitor.py
      - name: Poll QQQ price versus last completed close
        env:
          ALPACA_PAPER_API_KEY_B0: ${{ secrets.ALPACA_PAPER_API_KEY_B0 }}
          ALPACA_PAPER_API_SECRET_B0: ${{ secrets.ALPACA_PAPER_API_SECRET_B0 }}
        run: PYTHONPATH=research python research/qqq_intraday_monitor.py --report qqq-intraday-monitor.json
      - name: Persist QQQ emergency-exit latch to shared paper ledger
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp research/record_emergency_exit_latch.py /tmp/record_emergency_exit_latch.py
          cp research/paper_virtual_portfolio.py /tmp/paper_virtual_portfolio.py
          cp qqq-intraday-monitor.json /tmp/qqq-intraday-monitor.json
          git fetch --no-tags origin +refs/heads/paper-execution-ledger:refs/remotes/origin/paper-execution-ledger
          git checkout -B paper-execution-ledger origin/paper-execution-ledger
          mkdir -p /tmp/paper-state
          git show origin/paper-execution-ledger:data/paper_execution/b0_state.json > /tmp/paper-state/b0_state.json
          git show origin/paper-execution-ledger:data/paper_execution/f75_state.json > /tmp/paper-state/f75_state.json
          PYTHONPATH=/tmp python /tmp/record_emergency_exit_latch.py --report /tmp/qqq-intraday-monitor.json --state-dir /tmp/paper-state | tee /tmp/emergency-latch-result.json
          if grep -q '"latch_changed": true' /tmp/emergency-latch-result.json; then
            cp /tmp/paper-state/b0_state.json data/paper_execution/b0_state.json
            cp /tmp/paper-state/f75_state.json data/paper_execution/f75_state.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/paper_execution/b0_state.json data/paper_execution/f75_state.json
            git commit -m "paper: latch QQQ emergency exit for both portfolios"
            git push origin HEAD:paper-execution-ledger
          else
            echo "No new emergency latch to persist."
          fi
          cp /tmp/qqq-intraday-monitor.json qqq-intraday-monitor.json
      - name: Upload poll result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-intraday-monitor
          path: qqq-intraday-monitor.json
          if-no-files-found: warn
          retention-days: 30
