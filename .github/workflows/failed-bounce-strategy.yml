name: Failed bounce strategy walk forward
on:
  push:
    paths: ["research/failed_bounce_strategy_walkforward.py",".github/workflows/failed-bounce-strategy.yml"]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/failed_bounce_strategy_walkforward.py
      - uses: actions/upload-artifact@v4
        with:
          name: failed-bounce-strategy
          path: |
            data/research/failed_bounce_strategy_full.csv
            data/research/failed_bounce_strategy_walkforward.csv
