name: ETF-021 Multi-Horizon ML Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - "research/backtest_etf021_multi_horizon_ml_diagnostics.py"
      - ".github/workflows/etf021-multi-horizon-ml.yml"

concurrency:
  group: etf021-multi-horizon-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research/requirements.txt
      - name: Build lightweight ETF-020 dataset
        run: python research/build_etf020_dataset.py
      - name: Run ETF-021 multi-horizon ML diagnostics
        working-directory: research
        env:
          PYTHONPATH: .
        run: python backtest_etf021_multi_horizon_ml_diagnostics.py

# Focused diagnostic workflow; no portfolio selection is performed here.

