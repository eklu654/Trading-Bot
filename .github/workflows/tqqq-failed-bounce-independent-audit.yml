name: TQQQ failed-bounce independent audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/audit_failed_bounce_canonical_independent.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-failed-bounce-independent-audit
          path: |
            data/research/failed_bounce_independent_audit_summary.csv
            data/research/failed_bounce_independent_audit_events.csv
