name: QQQ drawdown-warning B0 counterfactual
on:
  push:
    paths:
      - "research/qqq_drawdown_warning_b0_counterfactual.py"
      - "research/tqqq_canonical_same_input_reconciliation.py"
      - "research/causal_execution.py"
      - ".github/workflows/qqq-drawdown-warning-b0-counterfactual.yml"
  workflow_dispatch:
jobs:
  counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python -m pip install -r research/requirements.txt
      - name: Run B0 drawdown-warning counterfactual
        run: PYTHONPATH=research python research/qqq_drawdown_warning_b0_counterfactual.py
      - uses: actions/upload-artifact@v4
        with:
          name: qqq-drawdown-warning-b0-counterfactual
          path: |
            data/research/qqq_drawdown_warning_b0_counterfactual_summary.csv
            data/research/qqq_drawdown_warning_b0_counterfactual_costs.csv
            data/research/qqq_drawdown_warning_b0_counterfactual_daily.csv
            data/research/qqq_drawdown_warning_b0_counterfactual_manifest.json
