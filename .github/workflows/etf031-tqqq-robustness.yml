name: ETF-031 TQQQ Robustness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/backtest_etf031_tqqq_robustness.py"
      - "research/etf031_supplemental_path_stress.py"
      - "tests/test_etf031_tqqq_robustness.py"
      - "tests/test_etf031_supplemental_path_stress.py"
      - "research/test_dma_family_rotation.py"
      - "research/test_dma_family_rotation_risk_overlay.py"
      - "research/build_historical_regime_dataset.py"
      - ".github/workflows/etf031-tqqq-robustness.yml"
  push:
    paths:
      - "research/backtest_etf031_tqqq_robustness.py"
      - "research/etf031_supplemental_path_stress.py"
      - "tests/test_etf031_tqqq_robustness.py"
      - "tests/test_etf031_supplemental_path_stress.py"
      - ".github/workflows/etf031-tqqq-robustness.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  etf031:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            research/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt -r requirements-dev.txt

      - name: Compile
        run: |
          python -m py_compile research/backtest_etf031_tqqq_robustness.py
          python -m py_compile research/etf031_supplemental_path_stress.py

      - name: Run ETF-031 unit tests
        run: python -m pytest -q tests/test_etf031_tqqq_robustness.py tests/test_etf031_supplemental_path_stress.py

      - name: Build ETF-031 market dataset
        run: >-
          python research/build_historical_regime_dataset.py --symbols
          SPY SPXL QQQ TQQQ SOXX SOXL DIA UDOW IWM TNA

      - name: Run ETF-031 robustness audit
        run: python research/backtest_etf031_tqqq_robustness.py

      - name: Run ETF-031 supplemental path stress
        run: python research/etf031_supplemental_path_stress.py

      - name: Print ETF-031 controls
        run: cat data/research/etf031_control_summary.csv

      - name: Print ETF-031 rolling statistics
        run: cat data/research/etf031_rolling_stats.csv

      - name: Print ETF-031 lower-CAGR scenarios
        run: cat data/research/etf031_lower_future_cagr_scenarios.csv

      - name: Print ETF-031 supplemental stress
        run: |
          cat data/research/etf031_individual_observation_stress.csv
          cat data/research/etf031_severe_bear_recovery_stress.csv
      - name: Validate ETF-031 supplemental consistency
        run: |
          python - <<'PY'
          import math
          import pandas as pd

          controls = pd.read_csv("data/research/etf031_control_summary.csv")
          observation = pd.read_csv("data/research/etf031_individual_observation_stress.csv")
          bear = pd.read_csv("data/research/etf031_severe_bear_recovery_stress.csv")

          baseline = float(controls.loc[(controls["strategy"] == "TQQQ_buy_and_hold") & (controls["cost_bps"] == 0), "ending_balance_5000"].iloc[0])
          supplemental = float(observation.loc[observation["scenario"] == "baseline", "ending_balance_5000"].iloc[0])
          if not math.isclose(baseline, supplemental, rel_tol=1e-9, abs_tol=0.01):
              raise SystemExit(f"Supplemental TQQQ baseline {supplemental} does not match ETF-031 control baseline {baseline}")

          if bear["ending_balance_5000"].nunique() <= 1:
              raise SystemExit("Severe-bear stress has no terminal-value sensitivity.")

          print(f"Validated supplemental baseline: ${supplemental:,.2f}")
          print("Validated severe-bear stress has path-sensitive terminal values.")
          PY

      - name: Upload ETF-031 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etf031-tqqq-robustness
          path: |
            data/research/etf031_control_summary.csv
            data/research/etf031_rolling_stats.csv
            data/research/etf031_rolling_summary.csv
            data/research/etf031_start_date_sensitivity.csv
            data/research/etf031_era_sensitivity.csv
            data/research/etf031_exceptional_year_removal.csv
            data/research/etf031_path_stress.csv
            data/research/etf031_lower_future_cagr_scenarios.csv
            data/research/etf031_individual_observation_stress.csv
            data/research/etf031_severe_bear_recovery_stress.csv
          if-no-files-found: error

      - name: Report result to pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh pr comment "$PR_NUMBER" --body "ETF-031 workflow result: **$JOB_STATUS**. This report is emitted by the workflow itself so the result remains visible even when the Actions-run connector cannot enumerate the run."
