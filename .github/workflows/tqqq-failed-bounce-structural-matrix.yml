name: TQQQ failed-bounce structural matrix
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - run: PYTHONPATH=research python research/failed_bounce_structural_matrix.py
      - uses: actions/upload-artifact@v4
        with:
          name: tqqq-failed-bounce-structural-matrix
          path: |
            data/research/failed_bounce_structural_events.csv
            data/research/failed_bounce_structural_signal_stats.csv
            data/research/failed_bounce_structural_strategy_full.csv
