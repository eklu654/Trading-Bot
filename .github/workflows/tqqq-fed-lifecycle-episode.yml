name: Fed Lifecycle Episode Validation

on:
  push:
    paths:
      - "research/test_tqqq_fed_lifecycle_episode.py"
      - ".github/workflows/tqqq-fed-lifecycle-episode.yml"
      - "research/requirements.txt"
  workflow_dispatch:

concurrency:
  group: tqqq-fed-lifecycle-episode
  cancel-in-progress: false

jobs:
  episode-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Compile
        run: python -m py_compile research/test_tqqq_fed_lifecycle_episode.py
      - name: Run episode validation
        run: python research/test_tqqq_fed_lifecycle_episode.py
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-fed-lifecycle-episode
          path: |
            data/research/tqqq_fed_lifecycle_episode_events.csv
            data/research/tqqq_fed_lifecycle_episode_summary.csv
